[package]
name = "metrale-config"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Metrale Engine: the typed model config tree (HF config.json parsing, GGUF metadata, capabilities)."

[features]
default = ["cuda"]
cuda = ["metrale-core/cuda"]
metal = ["metrale-core/metal"]

[dependencies]
metrale-core = { path = "../core", default-features = false }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
