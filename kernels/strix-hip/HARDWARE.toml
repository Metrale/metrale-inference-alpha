[hardware]
name = "strix"
vendor = "hip"
# 2026-09-25: AMD gfx1151 (Strix Halo). vendor "hip" compiles the sources
# with `hipcc --genco --offload-arch=<arch>` (crates/kernels/build_target.rs,
# HipTarget).

arch = "gfx1151"
compute_capability = "11.5.1"
# 2026-09-25: compute_capability and the memory_* keys are descriptive: no
# build or runtime code reads them.
memory_bandwidth_gbps = 256
memory_type = "LPDDR5X"



memory_gb = 64







