[build]
# 2026-09-25: No -DHDIM here: a global define would change each kernel that sets HDIM only when it is
# undefined, such as common/paged_decode_attn.cu (256).
extra_nvcc_flags = ["--fmad=false"]

# 2026-09-25: File stem -> module name overrides, merged per key over common/KERNEL.toml's; a stem not
# listed in either is its own module name.
[modules]
e2m1_branchless = "e2m1"
moe_permute = "moe"
dense_gemm_bf16 = "gemm"
dense_gemm_splitk = "gemm_splitk"
dense_gemm_tc = "gemm_tc"
rms_norm = "norm"
argmax_bf16 = "argmax"
dense_gemv_bf16 = "gemv"
dense_gemv_fp8w = "gemv_fp8w"
moe_shared_expert_fused_batch2 = "moe_fused_batch2"
moe_shared_expert_fused_batch3 = "moe_fused_batch3"
quantize_bf16_to_nvfp4 = "quantize_nvfp4"
paged_decode_attn = "paged_decode"
paged_decode_attn_mla = "paged_decode_mla"
paged_decode_attn_fp8 = "paged_decode_fp8"
paged_decode_attn_fp8_mla = "paged_decode_fp8_mla"
paged_decode_attn_nvfp4 = "paged_decode_nvfp4"
w4a16_gemm = "w4a16"
kv_cache_append = "kv_cache"
moe_w4a16_grouped_gemm = "moe_w4a16"
moe_sorted_prefill = "moe_sorted"
attn_prefill_paged = "prefill_paged"
attn_prefill_paged_fp8 = "prefill_paged_fp8"
attn_prefill_paged_nvfp4 = "prefill_paged_nvfp4"
attn_prefill_fp8kv = "prefill_fp8kv"
nemotron_moe_prefill = "nemotron_moe_prefill"
mla_absorbed = "mla_absorbed"
mla_prefill_attn = "mla_prefill_attn"
grouped_gemm_mla = "grouped_gemm_mla"
mla_fused_prefill = "mla_fused_prefill"
mla_paged_decode = "mla_paged_decode"
mla_paged_decode_fp8 = "mla_paged_decode_fp8"
reshape_and_cache_turbo = "reshape_and_cache_turbo"
paged_decode_attn_turbo4 = "paged_decode_turbo4"
wht_bf16 = "wht_bf16"
paged_decode_attn_turbo8 = "paged_decode_turbo8"
paged_decode_attn_turbo4_512 = "paged_decode_turbo4_512"
paged_decode_attn_turbo8_512 = "paged_decode_turbo8_512"
paged_decode_attn_turbo3 = "paged_decode_turbo3"
paged_decode_attn_turbo3_128 = "paged_decode_turbo3_128"
paged_decode_attn_turbo4_128 = "paged_decode_turbo4_128"
paged_decode_attn_turbo8_128 = "paged_decode_turbo8_128"
attn_prefill_512 = "attn_prefill_512"
paged_decode_attn_512 = "paged_decode_attn_512"

hyper_connection = "hyper_connection"

csa_compress = "csa_compress"

prefill_attn_compressed = "prefill_attn_compressed"

# 2026-09-25: This tree's moe_silu_mul.cu, which adds a SwiGLU limit, has no `silu_mul_quant_fp8`. The MoE
# layer checks its handle and runs `silu_mul` then `per_token_group_quant_fp8` instead
# (`fused_silu_quant_ok` in model-layers moe/forward_prefill_fp8.rs).

[shadow_exempt]
moe_silu_mul = ["silu_mul_quant_fp8"]

# 2026-09-25: Entries of this directory that win over a common/ entry with the same file stem. Each needs a
# stated reason; an undeclared win and a declaration that wins nothing are both layout errors
# (crates/closure/src/layout.rs).
[shadow]
moe_silu_mul = "fork of gb10/common/moe_silu_mul.cu (179 of 169 lines differ); fork of gb10/common/moe_silu_mul.cu (179 of 169 lines differ); see kernels/FORKS.md"
moe_w4a16_grouped_gemm = "fork of gb10/common/moe_w4a16_grouped_gemm.cu (1954 of 1494 lines differ); fork of gb10/common/moe_w4a16_grouped_gemm.cu (1954 of 1494 lines differ); see kernels/FORKS.md"
paged_decode_attn_nvfp4 = "fork of gb10/common/paged_decode_attn_nvfp4.cu (71 of 581 lines differ); fork of gb10/common/paged_decode_attn_nvfp4.cu (71 of 581 lines differ); see kernels/FORKS.md"
w4a16_gemm = "fork of gb10/common/w4a16_gemm.cu (1402 of 1410 lines differ); fork of gb10/common/w4a16_gemm.cu (1402 of 1410 lines differ); see kernels/FORKS.md"
