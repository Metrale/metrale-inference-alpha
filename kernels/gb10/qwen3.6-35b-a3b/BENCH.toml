# 2026-09-25: The nvfp4head recipe. Measured 2026-09-22 on this instrument with MTP k=3, aggregate
# tok/s, NVFP4 head vs bf16 head: C=1 60.92 vs 55.49, C=2 69.85 vs 67.45, C=4 70.82 vs 66.79.





recipe = "qwen3.6/qwen3.6-35b-a3b-fp8-nvfp4head"
label = "Qwen3.6-35B-A3B MoE flagship (FP8), published instrument"
default = true
status = "measured"
note = """\
The MoE half of the concurrency curve. The MoE decode path takes the \
grouped-GEMM expert arm above the width gate (n >= 16, layers/mod.rs \
moe_grouped_decode_min_rows) where the dense path never does, so C=16 \
exercises code on this model that the dense sweep cannot reach at any \
concurrency; a dense record cannot speak for it. \
★ ITS OWN GATE ID (2026-09-20), `concurrency-sweep-moe`, not a second \
checkpoint of `concurrency-sweep`. A required gate has ONE declared subject \
per box class (check.rs record_is_required_subject) and baseline_for refuses \
two `default = true` checkpoints on one gate, so as a variant of the dense \
gate this entry could never be run by `bench certify` (it spawns each \
REQUIRED id with no --checkpoint) and its floors could never fail a merge. \
The mechanism is the one `concurrency-sweep-dflash2` already uses. \
★ THE INSTRUMENT IS THE PUBLISHED ONE, not the dense gate's. The dense gate \
measures ISL 512 / OSL 320 on the natural code fixture; this entry pins ISL \
128 / OSL 1024 on the `essay` request (bench/ladder38 harness, byte for \
byte, #1154) at C=1,2,4,8,16 — the instrument the ONLY vLLM measurement of \
this checkpoint was taken on (bench/baselines/qwen36-35b-a3b/published.json, \
2026-09-19, dgx2), which stops at C=16 by design because C >= 32 exhausted \
GB10's unified memory under vLLM and powercycled the box. This entry has no \
history on any instrument, so nothing is lost by choosing the comparable \
one; its tok/s will read ~4x the dense gate's and MUST NEVER share an axis \
with them. Read each gate against its own history only. \
★ SERVE PROFILE = the one-shot's adjudicated parity profile, as the \
manifest's parity_note records it: ctx 2048, batch cap 128, util 0.85, bf16 \
KV, MTP K=4, thinking off, presence/frequency penalties 0.0 (the essay \
request pins those per request), fifo scheduling (the recipe defaults to \
slai, which vLLM has no counterpart for). Each key is justified inline in \
[benchmarks.serve_overrides] below; every one is disclosed on the record and \
demanded there by check_record, and together they DECLARE every axis \
site/src/lib/ladder-baselines.js fingerprints, so a record can be judged \
against the one-shot axis by axis instead of refused as undeclared. \
★ MEASURED 2026-09-23 — THE BOOTSTRAP THIS ENTRY PRESCRIBED, done in order. \
Until then it carried NO metrics table on purpose: zero records of this \
checkpoint existed under .benchmarks/concurrency-sweep*/, and a guessed \
threshold a run could clear would report PASS for something nobody measured \
(this file's header rule). The gate cannot bootstrap itself (baseline_for \
drops an unmeasured entry, so --pull-request-gate refuses to run it), so: \
(1) the recipe was served by hand on dgx1 (spark-256a) from met e8a212247c \
with EXACTLY the serve_overrides below applied — argv sha256 02c9d45ef999… \
(the server's own /serve-config agreed), binary sha256 2dcef02f15ba…, and NO \
METRALE_*/METRALE_* lever in the serve's environment; (2) `met benchmark run \
concurrency-sweep-moe --url <it> --model Qwen/Qwen3.6-35B-A3B-FP8 --param \
prompt_mode=essay --param isls=128 --param osl=1024 --param \
concurrencies=1,2,4,8,16` ran THREE times on that one frozen binary, zero \
request errors and zero vacuous cells in every rep — aggregate tok/s per rep \
C=1/2/4/8/16: 73.77/85.15/97.56/107.40/107.69, 72.94/84.52/98.42/106.51/107.86, \
72.67/85.74/96.85/107.30/108.55 (means 73.13/85.14/97.61/107.07/108.03, sample \
sigma 0.57/0.61/0.79/0.49/0.46); (3) the floors below are mean - max(3*sigma, \
