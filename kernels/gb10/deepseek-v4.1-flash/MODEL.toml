[model]
name = "deepseek-v4.1-flash"
hf_id = "deepseek-ai/DeepSeek-V4.1-Flash"
architecture = "MLA + MoE (384 routed, top-6) + mHC + engram + shared compressed attention (CSA)"

# 2026-09-25: `deepseek_v41_config_from_gguf_metadata` (crates/model-weights/src/weights/gguf/
# deepseek_v41_real_file_test.rs) asserts the same hidden, layer, vocab, head, MoE, MLA-rank, index and
# engram values against the Q2_K GGUF's own metadata.
layers_total = 40
layers_full_attention = 40

hidden_dim = 5120
head_dim = 512
q_heads = 64
kv_heads = 1
intermediate_size = 0

vocab_size = 129280
max_position_embeddings = 1048576
rope_theta = 160000
partial_rotary_factor = 0.125


kv_lora_rank = 512
q_lora_rank = 1280
qk_rope_head_dim = 64


num_experts = 384
num_shared_experts = 1
moe_intermediate_size = 2304
top_k = 6


hc_mult = 4

# 2026-09-25: deepseek-v4-flash/MODEL.toml sets none of the keys below.
engram_layer_ids = [1, 14]
engram_max_ngram_size = 4
engram_n_heads = 8
engram_head_dim = 256
index_n_heads = 32
index_head_dim = 128
index_topk = 512
compress_rope_theta = 160000

# 2026-09-25: The kernels come from deepseek-v4-flash's tree (`kernel_source`, crates/closure/src/layout.rs).
# That tree also holds the V4.1 kernels: attn_v41, engram_v41, hc_v41, moe_v41 and the K-quant
# expert kernels in kquant_moe.

kernel_source = "deepseek-v4-flash"

[[model_types]]
model_type = "deepseek_v41"
hidden_size = 5120





# 2026-09-25: The same sampling values as deepseek-v4-flash/MODEL.toml.
[sampling.thinking]
temperature = 1.0
top_p = 1.0
top_k = 0
presence_penalty = 0.0

[sampling.coding]
temperature = 1.0
top_p = 1.0
top_k = 0
presence_penalty = 0.0

[sampling.general]
temperature = 1.0
top_p = 0.95
top_k = 20
presence_penalty = 0.0

[behavior]
enable_loop_watchdog = true
thinking_default = false
# 2026-09-25: The reference model quantises the latent KV row to e4m3 with a power-of-two block scale
# before caching it (crates/model-arch/src/deepseek_v41_ref/attn.rs, `act_quant_inplace(&mut kv)`).
default_kv_dtype = "fp8"





[expected_absent.w4a16]
w4a16_gemm_t_p3 = """
3-deep weight-pipeline twin shipped ONLY in qwen3.6-27b's shadow. The generic
model constructor probes it (model/impl_a1.rs), then falls back to
w4a16_gemm_t, which resolves here. V4.1 never dispatches a w4a16 GEMM: its
attention and MoE run on the attn_v41 / kquant_moe / moe_v41 kernels."""
