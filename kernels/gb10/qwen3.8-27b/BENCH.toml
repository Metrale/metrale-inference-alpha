# request (its MinHeap code prompt, temperature 0, seed 0, max_tokens 1500, reasoning_effort
# "none"), makes 3 runs and reports the median server decode rate. The run is inconclusive,
# a failing verdict, if any run emits under 750 tokens (MIN_OUTPUT_TOKENS), reports no
# server rate or no accepted draft tokens, or if accept_len_mean is under 1.5
# (decode_floor/score.rs).

[[benchmarks]]
quant = "nvfp4"
