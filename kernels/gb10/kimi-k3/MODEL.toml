# 2026-09-25: Serve matches a checkpoint to this target by [[model_types]]
# (ptx_for_config, crates/kernels/src/resolve.rs); the dimension keys in [model] do not
# take part. hf_id is the 0.40B checkpoint; several dimension keys give moonshotai/Kimi-K3's
# values (docs/k3/fixtures/ holds both config.json files).




[model]
name = "kimi-k3"
hf_id = "inference-optimization/Kimi-K3-0.40B"
params = "0.40B"
active_params = "0.06B"
architecture = "KDA + gated MLA + AttnRes + Stable LatentMoE"
# 2026-09-25: moonshotai/Kimi-K3 has 93 layers and 896 routed experts, top-16.

layers_total = 8
# 2026-09-25: 0.40B: layers 0-2 KDA, 3 MLA, 4-6 KDA, 7 MLA. moonshotai/Kimi-K3: 69 KDA + 24 MLA.
layer_pattern = "3 KDA then 1 gated MLA, repeating; last layer is always global MLA"
first_k_dense_replace = 1

hidden_dim = 7168
# 2026-09-25: 0.40B: hidden 1024, 8 heads. moonshotai/Kimi-K3: hidden 7168, 96 heads.


q_heads = 96
q_lora_rank = 1536
kv_lora_rank = 512
qk_nope_head_dim = 128
qk_rope_head_dim = 64
v_head_dim = 128
mla_use_nope = true
mla_use_output_gate = true


linear_num_heads = 96
linear_head_dim = 128
linear_conv_kernel = 4
use_full_rank_gate = true
gate_lower_bound = -5.0


attn_res_block_size = 12


moe_experts = 896
moe_topk = 16
shared_experts = 2
routed_expert_hidden_size = 3584
moe_intermediate = 3072


hidden_act = "situ"
activation_situ_beta = 4.0
activation_situ_linear_beta = 25.0

# 2026-09-25: moonshotai/Kimi-K3; parse_kimi_k3 sets model_type kimi_k3 (inner: kimi_linear).
[[model_types]]
model_type = "kimi_k3"
hidden_size = 7168

# 2026-09-25: inference-optimization/Kimi-K3-0.40B.
[[model_types]]
model_type = "kimi_k3"
hidden_size = 1024
