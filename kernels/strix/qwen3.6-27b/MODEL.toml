[model]
name = "qwen3.6-27b"
hf_id = "Qwen/Qwen3.6-27B"
params = "27B"
active_params = "27B"
architecture = "Hybrid Attention + GDN + Dense FFN + MRoPE"





layers_total = 64
layers_full_attention = 16
layers_linear_attention = 48

hidden_dim = 5120
head_dim = 256
q_heads = 24
kv_heads = 4
intermediate_size = 17408

vocab_size = 248320
max_position_embeddings = 262144
rope_theta = 10000000
attn_output_gate = true
partial_rotary_factor = 0.25




mrope_interleaved = true
mrope_section = [11, 11, 10]





mtp_layers = 1

# 2026-09-25: Not read: the server sets effective_context to 0
# (crates/server/src/main_modules/serve_load.rs).
effective_context = 24576

# 2026-09-25: Sampling presets per request category, compiled into the binary by parse_sampling_presets (crates/kernels/build_parse.rs).




























[sampling.thinking_text]
temperature = 0.6
top_p = 0.95
top_k = 20
presence_penalty = 0.0
frequency_penalty = 0.0
repetition_penalty = 1.1
dry_multiplier = 0.5

[sampling.thinking_coding]
temperature = 0.6
top_p = 0.95
top_k = 20
presence_penalty = 0.0
frequency_penalty = 0.0
repetition_penalty = 1.1
dry_multiplier = 0.5

[sampling.non_thinking]
temperature = 0.7
top_p = 0.8
top_k = 20
presence_penalty = 0.0
frequency_penalty = 0.0
repetition_penalty = 1.1
dry_multiplier = 0.5

[sampling.tools]
temperature = 0.6
top_p = 0.95
top_k = 20
presence_penalty = 0.0
frequency_penalty = 0.0
repetition_penalty = 1.1
dry_multiplier = 0.5

[behavior]





enable_loop_watchdog = true
# 2026-09-25: thinking_default is absent, which build_parse_behavior.rs reads as
# false: thinking is off by default.






thinking_in_tools = false
max_thinking_budget = 512
default_num_drafts = 1

# 2026-09-25: The Qwen3.6-27B config.json says model_type "qwen3_5". The
# "qwen3_6_moe" rewrite in crates/config/src/dispatch.rs applies only to MoE
# configs, so a dense 27B checkpoint matches the first entry.



[[model_types]]
model_type = "qwen3_5"
hidden_size = 5120

[[model_types]]
model_type = "qwen3_6_moe"
hidden_size = 5120

# 2026-09-25: Only draft_model is read at runtime: it names the DFlash drafter
# when --draft-model is not given (serve_phases/weights.rs). The drafter's shape
# comes from its own config.json (parse_dflash_config).




[dflash]
draft_model = "z-lab/Qwen3.6-27B-DFlash"
gamma = 16
window_size = 4096
mask_token_id = 248070



target_layer_ids = [1, 16, 31, 46, 61]
