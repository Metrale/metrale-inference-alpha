# Automatic fallback for the self-hosted command runner.
#
# WANT is `metrale-macos-burst`, the Apple box — not `metrale-cmd`, which lives on
# the metrale host along with every Linux runner. While that host is down,
# metrale-cmd can never answer, and a job routed to a label nothing answers does
# not fail: it QUEUES, creating no check run at all, so a required context reads
# as absent rather than red. The Apple runner is a separate machine and is up,
# so it is what the commands should route to. Point WANT back at metrale-cmd when
# the metrale host returns and the Linux pool is preferred again.
#
# `certification-commands.yml` and `certification-bot.yml` resolve their
# `runs-on` from the CMD_RUNNER_LABEL variable. That makes the switch instant
# when the runner is healthy and reversible by hand when it is not -- but a
# by-hand switch needs a hand, and a runner that dies at 2am leaves every
# /stamp and every status update queued behind a runner that will never answer.
#
# This flips the variable on our behalf. It deliberately runs on a GITHUB-HOSTED
# runner: it is the thing that notices the self-hosted one is gone, so it cannot
# depend on it. Latency does not matter here -- nobody is waiting on a health
# check -- which is exactly why the hosted queue is acceptable for this job and
# not for the commands themselves.
name: Command runner health

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    name: command runner health
    runs-on: ubuntu-latest
    steps:
      - name: Mint the certification App token
        id: apptoken
        if: vars.CERTIFICATION_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ vars.CERTIFICATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.CERTIFICATION_APP_PRIVATE_KEY }}

      - name: Point the commands at a runner that answers
        env:
          GH_TOKEN: ${{ steps.apptoken.outputs.token || github.token }}
          REPO: ${{ github.repository }}
          # The LINUX command runner, not the macOS burst Mac. These two jobs
          # manage different variables for different runners; a rebrand
          # find/replace once collapsed both onto the burst label, which routed
          # every certification command onto macOS the moment the Mac came
          # online. FALLBACK below is ubuntu-latest precisely because this job
          # is about the Linux queue.
          WANT: metrale-cmd
          FALLBACK: ubuntu-latest
        run: |
          set -uo pipefail
          # `online` is GitHub's own view of the runner's heartbeat, which is
          # what actually decides whether a job gets picked up.
          online=$(gh api "repos/$REPO/actions/runners" \
                     --jq "[.runners[] | select(any(.labels[]; .name == \"$WANT\")) | select(.status == \"online\")] | length" \
                     2>/dev/null) || online=UNKNOWN
          case "$online" in ''|*[!0-9]*) online=UNKNOWN ;; esac

          cur=$(gh api "repos/$REPO/actions/variables/CMD_RUNNER_LABEL" --jq '.value' 2>/dev/null) || cur=""
          echo "runners online with '$WANT': $online   CMD_RUNNER_LABEL=${cur:-<unset>}"

          # UNKNOWN means the API did not answer. Changing the routing on a
          # guess is worse than leaving it: a false "offline" would move every
          # command onto the hosted queue we built this to escape.
          if [ "$online" = "UNKNOWN" ]; then
            echo "::warning title=Runner health unknown::could not read the runner list; leaving CMD_RUNNER_LABEL as ${cur:-<unset>}."
            exit 0
          fi

          want="$WANT"
          [ "$online" -eq 0 ] && want="$FALLBACK"
          if [ "$cur" = "$want" ]; then
            echo "already correct — nothing to do."
            exit 0
          fi

          if gh api -X PATCH "repos/$REPO/actions/variables/CMD_RUNNER_LABEL" \
               -f name=CMD_RUNNER_LABEL -f value="$want" >/dev/null 2>&1; then
            if [ "$want" = "$FALLBACK" ]; then
              echo "::warning title=Command runner is offline::commands and the status bot moved to $FALLBACK. They will be slow until the self-hosted runner returns."
            else
              echo "::notice title=Command runner is back::commands and the status bot moved back to $WANT."
            fi
            echo "CMD_RUNNER_LABEL: ${cur:-<unset>} -> $want"
          else
            # Writing a variable needs `administration: write`, which the App may
            # not have been granted. Say so plainly rather than failing the run:
            # a red health check every 15 minutes trains people to ignore it.
            echo "::warning title=Cannot switch runners automatically::the token cannot write CMD_RUNNER_LABEL (needs 'administration: write' on the certification App). Set it by hand to '$want'."
          fi

  macos-health:
    name: macOS burst runner health
    # Same idea as the job above, for the opt-in macOS burst runner that
    # ci.yml's test-macos-metal job routes to. The crucial difference: for a
    # BURST runner, offline is the normal resting state, not a failure. The Mac
    # is a workstation that opts in for a while and then goes Off again, so a
    # cleared variable is routine and is reported as a notice, never a warning.
    #
    # Without this, turning the Mac Off would leave MACOS_RUNNER_LABEL pointing
    # at a label no online runner carries, and every Metal job would sit in
    # "waiting for a runner" instead of falling back to GitHub-hosted.
    runs-on: ubuntu-latest
    steps:
      - name: Mint the certification App token
        id: apptoken
        if: vars.CERTIFICATION_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ vars.CERTIFICATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.CERTIFICATION_APP_PRIVATE_KEY }}

      - name: Point the Metal job at a runner that answers
        env:
          GH_TOKEN: ${{ steps.apptoken.outputs.token || github.token }}
          REPO: ${{ github.repository }}
          ORG: ${{ github.repository_owner }}
          WANT: metrale-macos-burst
          FALLBACK: macos-14
        run: |
          set -uo pipefail
          # The burst controller removes the label before it stops the service,
          # so "online AND carrying the label" is the only honest test of
          # whether a job routed here would actually be picked up.
          #
          # Both scopes are counted. repos/{owner}/{repo}/actions/runners lists
          # REPOSITORY-level runners only -- an org-scoped runner is simply
          # absent from it, however available it is to this repo. Querying only
          # that endpoint means an org-registered burst Mac is invisible here,
          # MACOS_RUNNER_LABEL never gets set, and test-macos-metal sits on
          # macos-14 forever while a perfectly healthy runner idles.
          count_runners() {
            gh api "$1/actions/runners" --paginate \
              --jq "[.runners[] | select(any(.labels[]; .name == \"$WANT\")) | select(.status == \"online\")] | length" \
              2>/dev/null | awk '{t+=$1} END {print t+0}'
          }
          repo_online=$(count_runners "repos/$REPO") || repo_online=UNKNOWN
          case "$repo_online" in ''|*[!0-9]*) repo_online=UNKNOWN ;; esac
          # Reading org runners needs organization_self_hosted_runners: read on
          # the certification App. Without it this call 403s, which is UNKNOWN,
          # not zero.
          org_online=$(count_runners "orgs/$ORG") || org_online=UNKNOWN
          case "$org_online" in ''|*[!0-9]*) org_online=UNKNOWN ;; esac

          # Only a total blackout is UNKNOWN. If EITHER scope answered, trust
          # what it said and treat the unreadable scope as empty.
          #
          # The stricter rule -- zero proves absence only when BOTH scopes
          # answered -- assumed both are readable. They are not: listing
          # repository runners needs administration:read, which the
          # certification App does not have, so repo_online is permanently
          # UNKNOWN. Combined with org:0 when the Mac is Off, that rule never
          # cleared the label, and every Metal job queued against a label
          # nobody answers.
          #
          # The two failure directions are not symmetric. Guessing "offline"
          # wrongly sends a job to macos-14: slower, still correct. Guessing
          # "online" wrongly sends it to a runner that never answers: queued
          # until it is cancelled. For a runner that is Off by design most of
          # the time, fail toward the hosted runner.
          if [ "$repo_online" = UNKNOWN ] && [ "$org_online" = UNKNOWN ]; then
            online=UNKNOWN
          else
            r=$repo_online; [ "$r" = UNKNOWN ] && r=0
            o=$org_online;  [ "$o" = UNKNOWN ] && o=0
            online=$((r + o))
          fi
          echo "scopes -- repo:$repo_online org:$org_online -> $online"

          cur=$(gh api "repos/$REPO/actions/variables/MACOS_RUNNER_LABEL" --jq '.value' 2>/dev/null) || cur=""
          echo "runners online with '$WANT': $online   MACOS_RUNNER_LABEL=${cur:-<unset>}"

          if [ "$online" = "UNKNOWN" ]; then
            echo "::warning title=Runner health unknown::could not read the runner list; leaving MACOS_RUNNER_LABEL as ${cur:-<unset>}."
            exit 0
          fi

          want="$WANT"
          [ "$online" -eq 0 ] && want="$FALLBACK"
          if [ "$cur" = "$want" ]; then
            echo "already correct - nothing to do."
            exit 0
          fi

          # The variable may not exist yet on the first run; PATCH fails on a
          # missing variable, so fall back to POST to create it.
          if gh api -X PATCH "repos/$REPO/actions/variables/MACOS_RUNNER_LABEL" \
               -f name=MACOS_RUNNER_LABEL -f value="$want" >/dev/null 2>&1 \
             || gh api -X POST "repos/$REPO/actions/variables" \
                  -f name=MACOS_RUNNER_LABEL -f value="$want" >/dev/null 2>&1; then
            if [ "$want" = "$FALLBACK" ]; then
              echo "::notice title=Burst Mac is Off::test-macos-metal is on $FALLBACK. This is the normal resting state."
            else
              echo "::notice title=Burst Mac is Available::test-macos-metal moved to $WANT."
            fi
            echo "MACOS_RUNNER_LABEL: ${cur:-<unset>} -> $want"
          else
            echo "::warning title=Cannot switch runners automatically::the token cannot write MACOS_RUNNER_LABEL (needs 'administration: write' on the certification App). Set it by hand to '$want'."
          fi
