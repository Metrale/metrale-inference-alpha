metrale_nvfp4_mmq16_nc = "Same MMQ family — family-wide handle gate plus METRALE_FFN_NVFP4_MMQ opt-in."
metrale_nvfp4_mmq16_wc = "Same MMQ family — family-wide handle gate plus METRALE_FFN_NVFP4_MMQ opt-in."
metrale_nvfp4_mmq32_nc = "Same MMQ family — family-wide handle gate plus METRALE_FFN_NVFP4_MMQ opt-in."
metrale_nvfp4_mmq32_wc = "Same MMQ family — family-wide handle gate plus METRALE_FFN_NVFP4_MMQ opt-in."
