header:
  license:
    spdx-id: MIT OR Apache-2.0
    content: |
      SPDX-License-Identifier: MIT OR Apache-2.0
  paths:
    - 'crates/**/*.rs'
    - 'kernels/**/*.{cu,cuh,h,hpp,cpp}'
    - 'cuda_kernels/**/*.{cu,cuh,h,hpp,cpp}'
    - '.github/scripts/*.{sh,py}'
  paths-ignore:
    - 'target/**'
    - 'vendor/**'
    # Vendored llama.cpp/ggml CUDA MMQ sources (MIT-licensed upstream);
    # third-party material keeps its original license — never stamp the
    # project header here.
    - 'kernels/gb10/qwen3.6-27b/nvfp4/q4k_vendor/**'
    # Third-party files outside the globs above today, listed so that a wider
    # `paths` never stamps them. See THIRD_PARTY_NOTICES.md for each licence.
    - 'bench/fp8_dgx2_drift/vllm_src/**'
    - 'bench/qwen4_exp/ref/**'
    - 'bench/ngram_ref/modeling_longcat_ngram.py'
  comment: on-failure
