# 2026-09-29: The tensor-core grouped expert kernel (8-row MMA column tiles, shared expert fused
# as the first block rows). Weights are converted by byte permute into a BF16 MMA (W8A16), or run
# an E4M3 MMA on per-128 quantized activations (W8A8, a file twin). Its format, activation and
# epilogue are the policies a new MoE would plug in. 2026-10-02: the W8A16 warp is one template
# over a weight-format policy (kernels/gb10/common/moe_grouped_tc.cuh), instantiated for FP8
# block-128 (moe_fp8_grouped_tc.cu) and NVFP4 g16 W4A16 (moe_nvfp4_grouped_tc.cu, the declared
# path of nvidia/Qwen3.6-35B-A3B-NVFP4); both admit 1..=256 rows (the *_TC_MAX_ROWS constants).
[[family]]
id = "moe_grouped_tc"
description = "Tensor-core grouped experts + shared expert (FP8 block-128 W8A16/W8A8, NVFP4 g16 W4A16, BF16)"
compute = "tensor_core"
mma = "mma.sync.m16n8k16.bf16"
kernel_compute."moe_fp8_grouped_tc_w8a8::moe_act_quant_e4m3" = { compute = "memory" }
kernel_compute."moe_fp8_grouped_tc_w8a8::moe_expert_gate_up_act_fp8_grouped_tc_w8a8" = { compute = "tensor_core", mma = "mma.sync.m16n8k32.e4m3" }
kernel_compute."moe_fp8_grouped_tc_w8a8::moe_expert_down_act_fp8_grouped_tc_w8a8" = { compute = "tensor_core", mma = "mma.sync.m16n8k32.e4m3" }
# 2026-10-02: The W8A16 gate+up kernels of every weight format share one SiLU epilogue
# (moe_grouped_tc.cuh): gate and up rounded to BF16, the FP32 product stored as the BF16 hi + lo
# pair. Stated per kernel, because the W8A8 point's quantizing epilogue also matches
# `epilogue = silu_mul` and points alone cannot tell the two apart for a SiLU node.
kernel_pipeline."moe_fp8_grouped_tc::moe_expert_gate_up_act_fp8_grouped_tc".silu_mul = { in = ["bf16"], compute = "f32", out = ["bf16"] }
kernel_pipeline."moe_nvfp4_grouped_tc::moe_expert_gate_up_act_nvfp4_grouped_tc".silu_mul = { in = ["bf16"], compute = "f32", out = ["bf16"] }
kernel_pipeline."moe_bf16_grouped_tc::moe_expert_gate_up_act_bf16_grouped_tc".silu_mul = { in = ["bf16"], compute = "f32", out = ["bf16"] }
kernels = [
  "moe_fp8_grouped_tc::moe_expert_gate_up_act_fp8_grouped_tc",
  "moe_fp8_grouped_tc::moe_expert_down_act_fp8_grouped_tc",
  "moe_fp8_grouped_tc_w8a8::moe_act_quant_e4m3",
  "moe_fp8_grouped_tc_w8a8::moe_expert_gate_up_act_fp8_grouped_tc_w8a8",
  "moe_fp8_grouped_tc_w8a8::moe_expert_down_act_fp8_grouped_tc_w8a8",
  "moe_nvfp4_grouped_tc::moe_expert_gate_up_act_nvfp4_grouped_tc",
  "moe_nvfp4_grouped_tc::moe_expert_down_act_nvfp4_grouped_tc",
  "moe_bf16_grouped_tc::moe_expert_gate_up_act_bf16_grouped_tc",
  "moe_bf16_grouped_tc::moe_expert_down_act_bf16_grouped_tc",
]
rows = [1, 256]
# 2026-10-02: W8A16: the SiLU product is stored as two BF16 terms (about 16 significant bits,
# moe_fp8_grouped_tc.cu:223-227) and the down projection multiplies each term in a BF16 MMA
# (:192), so it reads BF16 operands, not the FP32 product the point's `down_input` names. The
# W8A8 twin's pipeline is the second point's.
pipeline.expert_gate_up = { in = ["bf16", "i32"], gather = "bf16", act = "bf16", weight = "fp8/block128x128->bf16", mma = "bf16*bf16", accumulate = "f32", scale = "f32", out = ["bf16"] }
pipeline.expert_down = { in = ["bf16", "i32"], act = "bf16", weight = "fp8/block128x128->bf16", mma = "bf16*bf16", accumulate = "f32", scale = "f32", out = ["bf16"] }
pipeline."linear:shared_gate_up" = { in = ["bf16"], act = "bf16", weight = "fp8/block128x128->bf16", mma = "bf16*bf16", accumulate = "f32", scale = "f32", out = ["bf16"] }
pipeline."linear:shared_down" = { in = ["bf16"], act = "bf16", weight = "fp8/block128x128->bf16", mma = "bf16*bf16", accumulate = "f32", scale = "f32", out = ["bf16"] }
pipeline."linear:shared_up" = "uninstantiated"
pipeline.silu_mul = { in = ["bf16"], compute = "f32", out = ["bf16"] }
pipeline.relu2 = "uninstantiated"
op = [
  { op = "expert_gate_up" }, { op = "expert_down" }, { op = "silu_mul" }, { op = "relu2" },
  { op = "linear", roles = ["shared_gate_up", "shared_up", "shared_down"] },
]
