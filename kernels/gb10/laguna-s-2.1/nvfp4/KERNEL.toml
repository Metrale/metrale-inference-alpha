[build]
extra_nvcc_flags = ["--fmad=false", "-DHDIM=128"]

[modules]
e2m1_branchless = "e2m1"
moe_permute = "moe"
dense_gemm_bf16 = "gemm"
dense_gemm_splitk = "gemm_splitk"
dense_gemm_tc = "gemm_tc"
rms_norm = "norm"
argmax_bf16 = "argmax"
dense_gemv_bf16 = "gemv"
dense_gemv_fp8w = "gemv_fp8w"
quantize_bf16_to_nvfp4 = "quantize_nvfp4"
paged_decode_attn = "paged_decode"
paged_decode_attn_fp8 = "paged_decode_fp8"
paged_decode_attn_nvfp4 = "paged_decode_nvfp4"
w4a16_gemm = "w4a16"
kv_cache_append = "kv_cache"
moe_topk_sigmoid = "moe_topk_sig"
moe_sorted_prefill = "moe_sorted"
attn_prefill_paged = "prefill_paged"
attn_prefill_paged_fp8 = "prefill_paged_fp8"
attn_prefill_paged_nvfp4 = "prefill_paged_nvfp4"
attn_prefill_fp8kv = "prefill_fp8kv"
reshape_and_cache_turbo = "reshape_and_cache_turbo"
wht_bf16 = "wht_bf16"
tq_plus_innerq_apply = "tq_plus_innerq_apply"

# 2026-09-26: Files this directory compiles from elsewhere in kernels/ (paths relative to
# kernels/<hardware>). They are staged with this directory's role, so their quoted
# #includes resolve here. See crates/closure/src/layout.rs.
[sources]
use = [
  "deepseek-v4-flash/nvfp4/w4a16_gemm.cu",
  "minimax-m2-229b/nvfp4/moe_w4a16_grouped_gemm.cu",
]

# 2026-09-25: Entries of this directory that replace a same-stem entry of common/. The
# layout resolver refuses an undeclared replacement, a declaration that replaces nothing,
# and an empty reason (crates/closure/src/layout.rs, layout_manifest.rs).
[shadow]
moe_w4a16_grouped_gemm = "uses gb10/minimax-m2-229b/nvfp4/moe_w4a16_grouped_gemm.cu over gb10/common/moe_w4a16_grouped_gemm.cu (1898 of 1642 lines differ); see kernels/FORKS.md"
w4a16_gemm = "uses gb10/deepseek-v4-flash/nvfp4/w4a16_gemm.cu over gb10/common/w4a16_gemm.cu (1402 of 1410 lines differ); see kernels/FORKS.md"
