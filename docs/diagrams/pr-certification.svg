<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 880" width="1200" height="880" font-family="Urbanist, Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-label="Metrale Engine PR Certification merge process">
  <title>Metrale Engine — PR Certification merge process</title>

  <defs>
    <marker id="tipInk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#D9D9DE"/>
    </marker>
    <marker id="tipGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#E4C070"/>
    </marker>
    <marker id="tipMuted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8A8F99"/>
    </marker>
  </defs>

  <rect width="1200" height="880" fill="#0E1318"/>

  <!-- Metrale Engine mark, unmodified, at 44px tall with clear space respected -->
  <g transform="translate(64 22) scale(0.08835) translate(8 128)" aria-hidden="true"><defs><linearGradient id="cert-m-v" x1="0" y1="0" x2="0.25" y2="1"><stop offset="0" stop-color="#CDBFF1"/><stop offset="1" stop-color="#9F8DD8"/></linearGradient><linearGradient id="cert-m-c" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6FD9EC"/><stop offset="1" stop-color="#5A96BD"/></linearGradient><linearGradient id="cert-m-g" x1="0.8" y1="0" x2="0.2" y2="1"><stop offset="0" stop-color="#E4C070"/><stop offset="1" stop-color="#AE8A3F"/></linearGradient><linearGradient id="cert-m-w" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F7F7F9"/><stop offset="1" stop-color="#D9D9DE"/></linearGradient></defs><path d="M0 0L189 189L189 265L47 123L47 362L0 362Z" fill="url(#cert-m-w)"/><path d="M378 0L189 189L189 265L331 123L331 362L378 362Z" fill="url(#cert-m-v)"/><rect x="105" y="326" width="168" height="36" fill="url(#cert-m-c)"/><path d="M464 -118L502 -118C506 -118 508 -116 508 -112C500 -92 468 -60 442 -44L438 -42L408 -42C404 -42 402 -44 402 -48C432 -60 460 -100 464 -118Z" fill="url(#cert-m-g)"/></g>

  <text x="156" y="44" font-size="23" font-weight="650" fill="#D9D9DE">PR Certification</text>
  <text x="156" y="66" font-size="13.5" fill="#8A8F99">How a change gets from opened to merged, and what knocks it back.</text>

  <!-- ============ LEFT: the flow ============ -->

  <rect x="64" y="96" width="336" height="42" rx="4" fill="#181F28" stroke="#2F3742"/>
  <text x="232" y="122" font-size="13.5" font-weight="600" fill="#D9D9DE" text-anchor="middle">Pull request opened</text>

  <path d="M 232 138 L 232 172" stroke="#D9D9DE" stroke-width="1.6" marker-end="url(#tipInk)"/>

  <rect x="64" y="176" width="336" height="104" rx="4" fill="#181F28" stroke="#2F3742"/>
  <rect x="64" y="176" width="4" height="104" fill="#CDBFF1"/>
  <text x="84" y="200" font-size="14.5" font-weight="650" fill="#CDBFF1">Stage 1 — Verification</text>
  <text x="84" y="222" font-size="11.5" fill="#D9D9DE">Formatting, clippy, typos, license headers,</text>
  <text x="84" y="238" font-size="11.5" fill="#D9D9DE">kernel structure, tests, merge ancestry.</text>
  <text x="84" y="260" font-size="11.5" fill="#8A8F99">Certification and the nine release-matrix</text>
  <text x="84" y="274" font-size="11.5" fill="#8A8F99">build legs are held back.</text>

  <path d="M 232 280 L 232 322" stroke="#D9D9DE" stroke-width="1.6" marker-end="url(#tipInk)"/>
  <rect x="86" y="288" width="292" height="24" rx="12" fill="#0E1318" stroke="#2F3742"/>
  <text x="232" y="304" font-size="11" fill="#D9D9DE" text-anchor="middle">/stamp, from anyone with write access</text>

  <rect x="64" y="326" width="336" height="158" rx="4" fill="#181F28" stroke="#2F3742"/>
  <rect x="64" y="326" width="4" height="158" fill="#6FD9EC"/>
  <text x="84" y="350" font-size="14.5" font-weight="650" fill="#6FD9EC">Stage 2 — Certification</text>

  <rect x="84" y="362" width="300" height="52" rx="3" fill="#1E2631" stroke="#2F3742"/>
  <text x="96" y="380" font-size="12" font-weight="600" fill="#D9D9DE">Engineer's seal</text>
  <text x="96" y="396" font-size="11" fill="#8A8F99">A codeowner comments /seal. The sealers'</text>
  <text x="96" y="408" font-size="11" fill="#8A8F99">owned paths must cover the whole diff.</text>

  <rect x="84" y="420" width="300" height="52" rx="3" fill="#1E2631" stroke="#2F3742"/>
  <text x="96" y="438" font-size="12" font-weight="600" fill="#D9D9DE">Benchmark records</text>
  <text x="96" y="454" font-size="11" fill="#8A8F99">Run the campaign on a GPU box and commit</text>
  <text x="96" y="466" font-size="11" fill="#8A8F99">the records. CI only checks that they cover.</text>

  <path d="M 232 484 L 232 530" stroke="#D9D9DE" stroke-width="1.6" marker-end="url(#tipInk)"/>
  <rect x="76" y="492" width="312" height="24" rx="12" fill="#0E1318" stroke="#2F3742"/>
  <text x="232" y="508" font-size="11" fill="#D9D9DE" text-anchor="middle">the seal covers the diff and every record still stands</text>

  <rect x="64" y="534" width="336" height="72" rx="4" fill="#181F28" stroke="#2F3742"/>
  <rect x="64" y="534" width="4" height="72" fill="#12B981"/>
  <text x="84" y="558" font-size="14.5" font-weight="650" fill="#12B981">Stage 3 — Ready to merge</text>
  <text x="84" y="580" font-size="11.5" fill="#D9D9DE">The certification check is green. Nothing is</text>
  <text x="84" y="594" font-size="11.5" fill="#D9D9DE">waiting on a person.</text>

  <path d="M 232 606 L 232 646" stroke="#D9D9DE" stroke-width="1.6" marker-end="url(#tipInk)"/>
  <rect x="92" y="612" width="280" height="24" rx="12" fill="#0E1318" stroke="#2F3742"/>
  <text x="232" y="628" font-size="11" fill="#D9D9DE" text-anchor="middle">a PR carrying records enters the queue alone</text>

  <rect x="64" y="650" width="336" height="80" rx="4" fill="#181F28" stroke="#2F3742"/>
  <rect x="64" y="650" width="4" height="80" fill="#12B981"/>
  <text x="84" y="674" font-size="14.5" font-weight="650" fill="#D9D9DE">Merge queue</text>
  <text x="84" y="696" font-size="11.5" fill="#8A8F99">The whole pipeline runs again against the</text>
  <text x="84" y="710" font-size="11.5" fill="#8A8F99">queue's merge commit, records included.</text>

  <path d="M 232 730 L 232 762" stroke="#D9D9DE" stroke-width="1.6" marker-end="url(#tipInk)"/>

  <rect x="64" y="766" width="336" height="42" rx="4" fill="#12B981"/>
  <text x="232" y="792" font-size="13.5" font-weight="650" fill="#0E1318" text-anchor="middle">Merged</text>

  <!-- demotion returns -->
  <path d="M 64 570 C 30 570, 30 400, 60 400" fill="none" stroke="#E4C070" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#tipGold)"/>
  <path d="M 64 690 C 12 690, 12 372, 60 372" fill="none" stroke="#E4C070" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#tipGold)"/>
  <text x="42" y="356" font-size="10.5" fill="#E4C070" text-anchor="start" transform="rotate(-90 42 356)">demoted</text>

  <!-- to blocked -->
  <path d="M 400 214 C 428 214, 430 150, 448 134" fill="none" stroke="#8A8F99" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#tipMuted)"/>

  <!-- ============ RIGHT: blocked, legend, table, notes ============ -->

  <rect x="452" y="96" width="340" height="82" rx="4" fill="#181F28" stroke="#8A8F99" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="468" y="120" font-size="14.5" font-weight="650" fill="#D9D9DE">Blocked</text>
  <text x="468" y="141" font-size="11.5" fill="#8A8F99">A merge conflict, or no common ancestor with</text>
  <text x="468" y="155" font-size="11.5" fill="#8A8F99">main. Green checks on a conflicting PR describe</text>
  <text x="468" y="169" font-size="11.5" fill="#8A8F99">a tree nobody will merge. Reachable at any stage.</text>

  <rect x="812" y="96" width="324" height="82" rx="4" fill="#181F28" stroke="#2F3742"/>
  <path d="M 830 124 L 872 124" stroke="#D9D9DE" stroke-width="1.6" marker-end="url(#tipInk)"/>
  <text x="884" y="128" font-size="11.5" fill="#D9D9DE">advance</text>
  <path d="M 830 152 L 872 152" stroke="#E4C070" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#tipGold)"/>
  <text x="884" y="156" font-size="11.5" fill="#D9D9DE">demotion</text>

  <text x="452" y="216" font-size="15" font-weight="650" fill="#D9D9DE">What survives what</text>

  <rect x="452" y="230" width="684" height="30" fill="#1E2631"/>
  <g font-size="11.5">
    <text x="466" y="250" font-weight="650" fill="#D9D9DE">Event</text>
    <text x="736" y="250" font-weight="650" fill="#D9D9DE">Stamp</text>
    <text x="846" y="250" font-weight="650" fill="#D9D9DE">Seal</text>
    <text x="956" y="250" font-weight="650" fill="#D9D9DE">Records</text>

    <text x="466" y="282" fill="#D9D9DE">A new commit is pushed to the PR</text>
    <text x="736" y="282" fill="#12B981">holds</text>
    <text x="846" y="282" fill="#E4C070" font-weight="600">voided</text>
    <text x="956" y="282" fill="#E4C070">voided if a perf path moved</text>

    <text x="466" y="316" fill="#D9D9DE">main advances, no perf path touched</text>
    <text x="736" y="316" fill="#12B981">holds</text>
    <text x="846" y="316" fill="#12B981">holds</text>
    <text x="956" y="316" fill="#12B981">holds</text>

    <text x="466" y="350" fill="#D9D9DE">main advances through a perf path</text>
    <text x="736" y="350" fill="#12B981">holds</text>
    <text x="846" y="350" fill="#12B981">holds</text>
    <text x="956" y="350" fill="#E4C070" font-weight="600">voided</text>

    <text x="466" y="384" fill="#D9D9DE">The queue composes another record PR</text>
    <text x="736" y="384" fill="#12B981">holds</text>
    <text x="846" y="384" fill="#12B981">holds</text>
    <text x="956" y="384" fill="#E4C070" font-weight="600">voided</text>

    <text x="466" y="418" fill="#D9D9DE">The PR falls into conflict</text>
    <text x="736" y="418" fill="#12B981">holds</text>
    <text x="846" y="418" fill="#12B981">holds</text>
    <text x="956" y="418" fill="#8A8F99">moot until it clears</text>
  </g>

  <line x1="452" y1="260" x2="1136" y2="260" stroke="#2F3742"/>
  <line x1="452" y1="294" x2="1136" y2="294" stroke="#232A34"/>
  <line x1="452" y1="328" x2="1136" y2="328" stroke="#232A34"/>
  <line x1="452" y1="362" x2="1136" y2="362" stroke="#232A34"/>
  <line x1="452" y1="396" x2="1136" y2="396" stroke="#232A34"/>
  <line x1="452" y1="430" x2="1136" y2="430" stroke="#2F3742"/>

  <text x="452" y="482" font-size="15" font-weight="650" fill="#D9D9DE">Why the two behave differently</text>

  <line x1="452" y1="498" x2="452" y2="576" stroke="#12B981" stroke-width="2"/>
  <text x="470" y="516" font-size="12" font-weight="600" fill="#D9D9DE">A seal survives main moving.</text>
  <text x="470" y="534" font-size="11.5" fill="#8A8F99">The sealer vouched for this diff, and the queue re-runs the full pipeline against the</text>
  <text x="470" y="550" font-size="11.5" fill="#8A8F99">composed tree. Reviewed work is allowed to compose. Re-seal only when the diff itself</text>
  <text x="470" y="566" font-size="11.5" fill="#8A8F99">changes.</text>

  <line x1="452" y1="592" x2="452" y2="670" stroke="#E4C070" stroke-width="2"/>
  <text x="470" y="610" font-size="12" font-weight="600" fill="#D9D9DE">Records never do.</text>
  <text x="470" y="628" font-size="11.5" fill="#8A8F99">Two campaigns measured apart do not compose — the interaction between them was never</text>
  <text x="470" y="644" font-size="11.5" fill="#8A8F99">measured, and calling it measured is the exact class of silent regression this gate exists</text>
  <text x="470" y="660" font-size="11.5" fill="#8A8F99">to prevent. Freeze the branch, run the campaign, queue alone.</text>

  <line x1="452" y1="686" x2="452" y2="748" stroke="#6FD9EC" stroke-width="2"/>
  <text x="470" y="704" font-size="12" font-weight="600" fill="#D9D9DE">A perf path is any of these.</text>
  <text x="470" y="722" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8A8F99">crates  kernels  Cargo.toml  Cargo.lock  vendor  jinja-templates</text>
  <text x="470" y="738" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8A8F99">rust-toolchain.toml  3rdparty_patches</text>

  <text x="452" y="788" font-size="11" fill="#8A8F99">A change under kernels/ that compiles to byte-identical device code does not void a record.</text>
  <text x="452" y="804" font-size="11" fill="#8A8F99">Site, blog, book and docs paths reach no record's inputs, so certification is skipped outright.</text>

  <line x1="64" y1="830" x2="1136" y2="830" stroke="#232A34"/>
  <text x="64" y="852" font-size="11" fill="#8A8F99">Copyright 2026 Metrale Corp.</text>
  <a href="https://dev.metrale.ai" xlink:href="https://dev.metrale.ai" target="_blank" rel="noopener">
    <text x="1136" y="852" font-size="11" fill="#6FD9EC" text-anchor="end">dev.metrale.ai</text>
  </a>

</svg>
