[build]
# 2026-09-25: -DHDIM=128 is the head dimension the HDIM-sized common/ attention kernels compile for
# (common/paged_decode_attn.cu defaults it to 256). This target's two paged_decode_attn_*mla.cu files redefine it
# to 320.
extra_nvcc_flags = ["--fmad=false", "-DHDIM=128"]










# 2026-09-25: Kernels this target may drop from common/ without the build warning about shadow drift; the
# list is the union over every KERNEL.toml layer. The pairs stay in `shadowed_dropped`, and the boot audit
# judges an unresolved lookup by MODEL.toml [expected_absent], not by this table.
#
# All five are common/rope.cu functions. This target's rope.cu defines only rope_forward and
# rope_forward_yarn, which rotate adjacent pairs (2i, 2i + 1) with frequencies from an inv_freq table;
# common/rope.cu's rope_forward rotates (i, i + rotary_dim / 2) and takes no inv_freq argument.
[shadow_exempt]
rope = [
    "rope_forward_proportional",
    "rope_forward_strided",
    "rope_forward_yarn_interleaved",
    "rope_forward_yarn_interleaved_inv",
    "rope_forward_yarn_scaled",
]


