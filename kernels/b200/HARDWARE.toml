[hardware]
name = "b200"
# 2026-09-25: An overlay of gb10 (crates/closure/src/layout.rs `discover`):
# a kernel file this tree does not hold is taken from kernels/gb10, and a
# file here that replaces a gb10 file of the same name must be declared in
# [shadow] of the KERNEL.toml beside it.
inherits = "gb10"
vendor = "nvidia"
# 2026-09-25: B200 / GB200, SM 10.0. An `sm_100a` build runs only on a CC
# 10.0 device (metrale_core::arch::ptx_arch_runs_on_device), so B300 (SM 10.3)
# is its own target, kernels/b300.


arch = "sm_100a"
compute_capability = "10.0"
# 2026-09-25: Compared at boot with the device's SM count; a mismatch logs a
# warning (gpu-runtime arch_preflight::check_sm_count).
sm_count = 148
# 2026-09-25: memory_bandwidth_gbps, memory_type and memory_gb are read by no
# code in this repository.
memory_bandwidth_gbps = 8000
memory_type = "HBM3e"
memory_gb = 180

# 2026-09-25: Flags added to every kernel compiled for this target, ahead of
# common/KERNEL.toml's and the model's (build_flags::merge_extra_flags).
#
# METRALE_NO_WARP_BLOCKSCALE_MMA compiles out every
# `#ifndef METRALE_NO_WARP_BLOCKSCALE_MMA` region of the gb10 sources this
# target inherits. ptxas rejects the warp-level block-scaled MMA in those
# regions on sm_100a ("Instruction 'mma with block scale' not supported on
# .target 'sm_100a'"; measured 2026-09-05 with CUDA 13.0.88, reproducible with
# `scripts/hopper_ptx_gate.sh --hw b200 --model qwen3.6-35b-a3b --strict`
# after dropping this flag). qwen3.6-35b-a3b/MODEL.toml declares the two
# moe_w4a16 entry points it removes in [expected_absent.moe_w4a16].






[build]
extra_nvcc_flags = ["-DMETRALE_NO_WARP_BLOCKSCALE_MMA"]

# 2026-09-25: Serving defaults for this target. build.rs (build_defaults.rs)
# bakes them into `metrale_kernels::TARGET_DEFAULTS`, and `resolve` in
# crates/model-layers/src/layers/ops/target_defaults.rs takes each row as the
# default that a `METRALE_*` variable can override. An unknown key fails the
# build.
#
# Every row equals `build_defaults::baseline`, and every row is written out
# even so (tests/target_defaults.rs:
# `b200_declares_the_conservative_table_not_hoppers`,
# `every_declaring_target_states_every_lever`).















[defaults]


lm_head_batchm_max = 8


ssm_batched_recurrent = false
# 2026-09-25: The kernels behind gdn_prefill_tc, ssm_ba_gates_hopper,
# fp8_act_quant_hopper and ffn_gateup_fused are sources in kernels/hopper/common,
# which this target's source set does not include.


gdn_prefill_tc = false
ssm_ba_gates_hopper = false






fp8_act_quant_hopper = false

decode_split_silu = true





attn_decode_splitk = "legacy"



ffn_m16_tc = false



attn_m16_tc = false


lm_head_m16_tc = false


attn_ncol_gemv = false


















ffn_gateup_fused = false










w8a8_prefill_max_m_widening = 4294967295
w8a8_prefill_max_m_narrowing = 4294967295

