[[family]]
id = "gdn_verify_fused_k2"
description = "Opt-in fused GDN verify at K = 2: conv + L2 + recurrence + gated norm"
compute = "cuda_core"
kernels = ["gdn_verify_fused_k2::gdn_verify_fused_conv_k2", "gdn_verify_fused_k2::gdn_verify_fused_norm_k2"]
rows = [2, 2]
# 2026-10-02: The L2 norm writes BF16 (gdn_verify_fused_k2.cu:131) and the norm kernel reads
# a BF16 `core` (:190-191); the recurrence between them is the WY2 kernel's pipeline (the engine
# launches gated_delta_rule_wy2 there, which the rule does not list).
pipeline.conv1d_update = { in = ["bf16"], state = "f32", compute = "f32", out = ["f32"] }
pipeline.l2_norm = { in = ["f32"], compute = "f32", out = ["bf16"] }
