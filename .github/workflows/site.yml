name: Site

# dev.metrale.ai and blog.dev.metrale.ai are retired. The engine's page is
# https://metrale.ai/engine and the blog is https://blog.metrale.ai, both
# published from the metrale.ai repository. What is left here is one file per
# old host, a Cloudflare Pages `_redirects`:
#
#   site/_redirects  -> Pages project metrale-engine-site  (dev.metrale.ai)
#   blog/_redirects  -> Pages project metrale-engine-blog  (blog.dev.metrale.ai)
#
# The Pages projects and the DNS records are deleted by hand, outside this
# repository. Until then this keeps every old link answering with a 301.
#
# `Site unit tests` and `Build SvelteKit site` are required contexts on main,
# so both jobs keep those names; branch protection names the strings.

on:
  push:
    branches: [main, master]
    paths:
      - 'site/**'
      - 'blog/**'
      - '.github/scripts/assert-host-redirects.py'
      - '.github/workflows/site.yml'
  # No path filter on pull_request or merge_group: this workflow emits required
  # checks, and a path-filtered required check never reports on PRs outside its
  # paths, leaving them permanently "expected" and unmergeable. The deploy job
  # stays push/dispatch-only by its own `if`.
  pull_request:
    branches: [main, master]
  merge_group:
  workflow_dispatch:

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Site unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Each tree must hold its `_redirects` and nothing else, every rule must
      # be a 301 onto the new host, and each path metrale.ai serves must keep
      # its path.
      - name: The two redirect deployments are what they claim
        run: python3 .github/scripts/assert-host-redirects.py

  build:
    # The name is a required context. Nothing is built any more: this packages
    # the two redirect deployments exactly as they are in the tree.
    name: Build SvelteKit site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Upload the dev.metrale.ai redirects
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dev-redirects
          path: site
          retention-days: 7
          if-no-files-found: error

      - name: Upload the blog.dev.metrale.ai redirects
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: blog-dev-redirects
          path: blog
          retention-days: 7
          if-no-files-found: error

  deploy:
    name: Deploy to Cloudflare Pages
    # `unit` as well as `build`: a failed check has to stop the deploy, not
    # just report next to it (#810).
    needs: [build, unit]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    environment:
      name: production-site
      url: https://metrale.ai/engine
    outputs:
      # The verify job below needs to know whether anything was actually
      # deployed; without this it would check a stale production against a
      # tree that never left the runner.
      configured: ${{ steps.secret_check.outputs.configured }}
    steps:
      - name: Check deploy secret presence
        id: secret_check
        env:
          CF_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ACCOUNT_ID" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set on the production-site environment — skipping the Pages deploy. Configure both to enable."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      # No checkout: only the two downloaded trees are uploaded, so nothing
      # else from the repository can reach production.
      - name: Download the dev.metrale.ai redirects
        if: steps.secret_check.outputs.configured == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dev-redirects
          path: site

      - name: Download the blog.dev.metrale.ai redirects
        if: steps.secret_check.outputs.configured == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: blog-dev-redirects
          path: blog

      # wrangler v4 refuses to start below Node 22, so the version is pinned
      # rather than inherited from the runner image.
      - name: Install Node
        if: steps.secret_check.outputs.configured == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      # `--branch` must match the project's production branch: a deployment on
      # any other branch gets a preview URL and does NOT move the custom domain.
      - name: Publish the dev.metrale.ai redirects
        if: steps.secret_check.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages deploy site \
            --project-name=metrale-engine-site \
            --branch=main \
            --commit-dirty=true

      - name: Publish the blog.dev.metrale.ai redirects
        if: steps.secret_check.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages deploy blog \
            --project-name=metrale-engine-blog \
            --branch=main \
            --commit-dirty=true

  verify:
    # A separate job because it needs a checkout for the script, and `deploy`
    # must not have one.
    name: Verify the deployed redirects
    needs: deploy
    if: needs.deploy.outputs.configured == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Against the live hosts: every rule answers 301 with its own target, and
      # every target answers 200.
      - name: The retired hosts redirect, and every target serves
        run: python3 .github/scripts/assert-host-redirects.py --live
