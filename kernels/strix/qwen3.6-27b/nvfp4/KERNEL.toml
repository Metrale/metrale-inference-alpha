[build]
# 2026-09-25: `-ffp-contract=off` is clang's spelling of nvcc's `--fmad=false` (no
# FP multiply-add contraction). SCALE receives these flags unchanged, after
# common/'s `--fmad=false` (crates/kernels/build_target.rs, build.rs).

extra_nvcc_flags = ["-ffp-contract=off"]

# 2026-09-25: File stem -> module name overrides, merged over common/'s per key
# (crates/kernels/build.rs); a stem listed nowhere is its own module name.

[modules]
e2m1_branchless = "e2m1"
moe_permute = "moe"
dense_gemm_bf16 = "gemm"
rms_norm = "norm"
argmax_bf16 = "argmax"
dense_gemv_bf16 = "gemv"
dense_gemv_fp8w = "gemv_fp8w"
moe_shared_expert_fused_batch2 = "moe_fused_batch2"
moe_shared_expert_fused_batch3 = "moe_fused_batch3"
quantize_bf16_to_nvfp4 = "quantize_nvfp4"
paged_decode_attn = "paged_decode"
paged_decode_attn_fp8 = "paged_decode_fp8"
paged_decode_attn_nvfp4 = "paged_decode_nvfp4"
w4a16_gemm = "w4a16"
kv_cache_append = "kv_cache"
moe_w4a16_grouped_gemm = "moe_w4a16"
moe_sorted_prefill = "moe_sorted"
attn_prefill_paged = "prefill_paged"
attn_prefill_paged_fp8 = "prefill_paged_fp8"
attn_prefill_paged_nvfp4 = "prefill_paged_nvfp4"
reshape_and_cache_turbo = "reshape_and_cache_turbo"
paged_decode_attn_turbo4 = "paged_decode_turbo4"
paged_decode_attn_turbo8 = "paged_decode_turbo8"
paged_decode_attn_turbo4_512 = "paged_decode_turbo4_512"
paged_decode_attn_turbo8_512 = "paged_decode_turbo8_512"
paged_decode_attn_turbo3 = "paged_decode_turbo3"
paged_decode_attn_turbo3_128 = "paged_decode_turbo3_128"
paged_decode_attn_turbo4_128 = "paged_decode_turbo4_128"
paged_decode_attn_turbo8_128 = "paged_decode_turbo8_128"

# 2026-09-25: Files this directory compiles from elsewhere in kernels/ (paths
# relative to kernels/<hardware>). They are staged into this directory's layer,
# so their quoted #includes resolve here. See crates/closure/src/layout.rs.
[sources]
use = [
  "../gb10/qwen3.6-27b/nvfp4/gated_delta_rule.cu",
  "../gb10/qwen3.6-27b/nvfp4/moe_w4a16_grouped_gemm.cu",
  "../gb10/qwen3.6-27b/nvfp4/w4a16_gemm.cu",
  "../gb10/qwen3.6-35b-a3b/nvfp4/gated_delta_rule_wy17.cu",
]

# 2026-09-25: Entries of this directory that replace a same-stem entry of a lower
# layer (common/ for a model directory). Every replacement needs a stated
# reason; kernels/FORKS.md has the diff distances.
[shadow]
gated_delta_rule = "uses gb10/qwen3.6-27b/nvfp4/gated_delta_rule.cu over gb10/common/gated_delta_rule.cu (2206 of 2514 lines differ); see kernels/FORKS.md"
moe_w4a16_grouped_gemm = "uses gb10/qwen3.6-27b/nvfp4/moe_w4a16_grouped_gemm.cu over gb10/common/moe_w4a16_grouped_gemm.cu (1678 of 1412 lines differ); see kernels/FORKS.md"
w4a16_gemm = "uses gb10/qwen3.6-27b/nvfp4/w4a16_gemm.cu over gb10/common/w4a16_gemm.cu (7341 of 7349 lines differ); see kernels/FORKS.md"
