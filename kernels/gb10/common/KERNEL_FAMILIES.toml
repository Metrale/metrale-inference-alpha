# 2026-09-29: Recurrent mixers: GatedDeltaNet and Mamba2.

[[family]]
id = "gdn_ba_gates_gemv"
description = "GDN in_proj_b|a GEMV fused with the beta/decay gates, one row per launch"
compute = "cuda_core"
kernels = ["ssm_preprocess::dense_gemv_ba_gates"]
rows = [1, 1]
# 2026-10-02: The b|a projection's FP32 sums go to the gates in registers, never rounded to
# BF16 (ssm_preprocess.cu:430-459): `ba` is held as f32, which the rules state (`holds`).
pipeline.linear = { in = ["bf16"], act = "bf16", weight = "bf16->bf16", mma = "bf16*bf16", accumulate = "f32", scale = "none", out = ["f32"] }
pipeline.gdn_gates = { in = ["f32"], compute = "f32", out = ["f32", "f32"] }
op = [{ op = "linear", roles = ["ba"] }, { op = "gdn_gates" }]
[[family.point]]
values = {}
how = "instantiation"
files = ["kernels/gb10/common/ssm_preprocess.cu"]

# 2026-09-30: `ssm_ba_gates_hopper` is the byte-identical twin `ops::dense_gemm_ba_gates_prefill`
