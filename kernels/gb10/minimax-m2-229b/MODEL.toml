[model]
name = "minimax-m2-229b"
hf_id = "MiniMaxAI/MiniMax-M2.7"
params = "229B"
active_params = "~10B"
architecture = "Full Attention + 256-expert Sigmoid-Routed MoE + MTP K=3"

layers_total = 62
layers_linear_attention = 0
layers_full_attention = 62
layer_pattern = "all full attention (attn_type_list = [1] * 62)"

moe_experts = 256
moe_topk = 8
moe_intermediate = 1536
shared_expert_intermediate = 0
moe_scoring_func = "sigmoid"
moe_routing_bias = true

hidden_dim = 3072
head_dim = 128
q_heads = 48
kv_heads = 8

# 2026-09-25: Partial RoPE: rotary_dim 64 of head_dim 128 (the checkpoint's config.json).
rotary_dim = 64
rope_theta = 5000000
partial_rotary_factor = 0.5


qk_norm_type = "per_layer"

vocab_size = 200064
max_position_embeddings = 196608
attn_output_gate = false

# 2026-09-25: MTP: 3 draft modules of one transformer layer each (the checkpoint's config.json).
mtp_layers = 3
mtp_transformer_layers = 1
mtp_type = "full_attention"

vision = false











[sampling.thinking_text]
temperature = 0.6
top_p = 0.95
top_k = 40
presence_penalty = 0.0
repetition_penalty = 1.1
dry_multiplier = 0.5

[sampling.thinking_coding]
temperature = 0.4
top_p = 0.95
top_k = 20
presence_penalty = 0.0
repetition_penalty = 1.1
dry_multiplier = 0.5

[sampling.non_thinking]
temperature = 0.7
top_p = 0.95
top_k = 40
presence_penalty = 0.0
repetition_penalty = 1.1
dry_multiplier = 0.5

[sampling.tools]
temperature = 0.4
top_p = 0.95
top_k = 20
presence_penalty = 0.0
frequency_penalty = 0.0
repetition_penalty = 1.1
dry_multiplier = 0.5

[behavior]
# 2026-09-25: Thinking off for a request with no thinking directive; an explicit directive
# overrides it. max_thinking_budget is the budget of a thinking-on request that names none
# (api/chat/thinking.rs).












thinking_in_tools = true
max_thinking_budget = 2048
thinking_default = false

[[model_types]]
model_type = "minimax_m2"
hidden_size = 3072

# 2026-09-25: Wildcard entry: a minimax_m2 checkpoint of any other hidden_size resolves here.
# ptx_for_config tries exact hidden_size matches before wildcards
# (crates/kernels/src/resolve.rs `resolve_target`).

[[model_types]]
model_type = "minimax_m2"

[kernel]


moe_gate_shmem_bytes = 6144

# 2026-09-25: The nvfp4 target builds with -DHDIM=128 (nvfp4/KERNEL.toml), this model's
# head_dim.






# 2026-09-25: Kernel lookups this model's dispatch may issue that this target does not
# ship. The boot kernel gate refuses any other unresolved lookup unless
# --dangerously-allow-unresolved-kernel-lookups is set (serve_phases/kernel_gate.rs).
# moe_w4a16_fused_gate_up_t_k64_m128 is not listed: nvfp4/moe_w4a16_grouped_gemm.cu
# defines it.



[expected_absent.w4a16]
w4a16_gemm_t_p3 = """
3-deep weight-pipeline twin shipped ONLY in qwen3.6-27b's shadow.
layers::tgemm_kernel probes it, then falls back to w4a16_gemm_t, which
resolves on this target's shadow. UNMEASURED — candidate, not loss."""
w4a16_gemm_t_k64_p3 = "Same family; layers::k64_kernel falls back to the required w4a16_gemm_t_k64 (resolves on this target's shadow)."
w4a16_gemm_t_k64_n64_p3 = "Narrow-N deep-K twin; layers::k64_n64_kernel returns 0-handle when absent, dispatch gates on handle != 0 before firing."
w4a16_gemm_t_m128_bf16 = "BF16-projection prefill twin of w4a16_gemm_t_m128; prefill_weights gates on handle != 0, falls back through the resolved w4a16 m128 path."

[expected_absent.w4a4]
w4a4_gemm_mfast = """
Shipped only in nemotron-labs-3-puzzle-75b-a9b's shadow. The attention
W4A4 prefill path is additionally OPT-IN ONLY (METRALE_ATTN_W4A4 env) and
dispatch gates on handle != 0 (paged_qkv.rs:49, paged_oproj.rs:32).
UNMEASURED."""

[expected_absent.moe_w4a16]
moe_w4a16_grouped_gemm_ptrtable_e8m0 = """
Native-MXFP4 (E8M0) scale-format variant shipped only in
deepseek-v4-flash's shadow. This NVFP4 checkpoint's scales are the
modelopt NVFP4 format, so dispatch uses the resolved ptrtable grouped
GEMM."""
moe_w4a16_grouped_gemm_ptrtable_t_e8m0 = "Same E8M0 family — NVFP4 target uses the resolved ptrtable_t variant."
moe_w4a16_grouped_gemm_ptrtable_t_k64_e8m0 = "Same E8M0 family — NVFP4 target uses the resolved ptrtable_t_k64 variant."
moe_w4a16_fused_gate_up_t_e8m0 = "Same E8M0 family — NVFP4 target uses the resolved fused_gate_up variant."
moe_w4a16_fused_gate_up_t_k64_e8m0 = "Same E8M0 family — NVFP4 target uses the resolved fused_gate_up_k64 variant."
moe_w4a16_fused_gate_up_t_k64_fp4 = "FUSED-FP4 gate_up (Holo-3.1 family); forward_prefill_routed gates on gateup_fp4 && handle != 0 before firing."
moe_w4a16_down_t_k64_fp4 = "FP4 down-projection twin; forward_prefill_routed gates on down_fp4 && handle != 0."
