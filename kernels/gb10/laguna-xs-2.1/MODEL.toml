metrale_nvfp4_mmq16_wc = "Same family; handle-gated, w4a16 arm resolves."
metrale_nvfp4_mmq32_nc = "Same family; handle-gated, w4a16 arm resolves."
metrale_nvfp4_mmq32_wc = "Same family; handle-gated, w4a16 arm resolves."
metrale_nvfp4_mmq64_nc = "Same family; handle-gated, w4a16 arm resolves."
metrale_nvfp4_mmq64_wc = "Same family; handle-gated, w4a16 arm resolves."
metrale_nvfp4_quantize_bf16 = "MMQ-family activation quantizer; only reached from the MMQ arms above."
metrale_nvfp4_repack = "MMQ-family weight repacker; only reached from the MMQ arms above."
metrale_nvfp4_scale_bf16 = "MMQ-family scale conversion; only reached from the MMQ arms above."
metrale_nvfp4_silu_mul_quant = "MMQ-family fused epilogue; only reached from the MMQ arms above."
metrale_nvfp4_silu_mul_scaled = "MMQ-family fused epilogue; only reached from the MMQ arms above."

[expected_absent.w4a16]
int8_gemm_faith2 = "Int8 requant experiment probed by dense_ffn; handle-gated, w4a16 arm resolves."
int8_gemm_i32acc = "Same family; handle-gated."
requant_a_bf16_int8 = "Same family — activation requant; only reached from the int8 arms above."
requant_w_nvfp4_int8 = "Same family — weight requant; only reached from the int8 arms above."
