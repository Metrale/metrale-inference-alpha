[build]

extra_nvcc_flags = ["--fmad=false", "-DHDIM=128"]

# 2026-09-25: File stem to module name. A stem that no layer's [modules] lists keeps its stem as the
# module name (crates/kernels/build.rs).
[modules]
e2m1_branchless = "e2m1"
moe_permute = "moe"
dense_gemm_bf16 = "gemm"
dense_gemm_splitk = "gemm_splitk"
dense_gemm_tc = "gemm_tc"
rms_norm = "norm"
argmax_bf16 = "argmax"
dense_gemv_bf16 = "gemv"
dense_gemv_fp8w = "gemv_fp8w"
quantize_bf16_to_nvfp4 = "quantize_nvfp4"
paged_decode_attn = "paged_decode"
paged_decode_attn_fp8 = "paged_decode_fp8"
paged_decode_attn_nvfp4 = "paged_decode_nvfp4"
w4a16_gemm = "w4a16"
w4a16_gemm_v2 = "w4a16_v2"
w4a16_gemm_v3 = "w4a16_v3"
kv_cache_append = "kv_cache"
moe_shared_expert_fused_batch2 = "moe_fused_batch2"
moe_shared_expert_fused_batch3 = "moe_fused_batch3"
moe_w4a16_grouped_gemm = "moe_w4a16"
moe_sorted_prefill = "moe_sorted"
attn_prefill_paged = "prefill_paged"
attn_prefill_paged_fp8 = "prefill_paged_fp8"
attn_prefill_paged_nvfp4 = "prefill_paged_nvfp4"
attn_prefill_fp8kv = "prefill_fp8kv"
nemotron_moe_prefill = "nemotron_moe_prefill"
reshape_and_cache_turbo = "reshape_and_cache_turbo"
paged_decode_attn_turbo4 = "paged_decode_turbo4"
wht_bf16 = "wht_bf16"
paged_decode_attn_turbo8 = "paged_decode_turbo8"
paged_decode_attn_turbo4_512 = "paged_decode_turbo4_512"
paged_decode_attn_turbo8_512 = "paged_decode_turbo8_512"
paged_decode_attn_turbo3 = "paged_decode_turbo3"
paged_decode_attn_turbo3_128 = "paged_decode_turbo3_128"
paged_decode_attn_turbo4_128 = "paged_decode_turbo4_128"
paged_decode_attn_turbo8_128 = "paged_decode_turbo8_128"

# 2026-09-25: moe_silu_mul.cu here defines no silu_mul_quant_fp8. The MoE layer resolves it with
# try_kernel, and while the handle is 0 (fused_silu_quant_ok in forward_prefill_fp8.rs) it runs the
# unfused silu_mul then per_token_group_quant_fp8 pair, whose silu_mul is this file's clamped kernel.

[shadow_exempt]
moe_silu_mul = ["silu_mul_quant_fp8"]

# 2026-09-25: Files this layer compiles from elsewhere in kernels/, as paths relative to kernels/<hardware>.
# The build stages them with this layer's role (leaf or common), so their quoted #includes resolve against
# that role's headers (crates/closure/src/layout.rs).
[sources]
use = [
  "deepseek-v4-flash/nvfp4/w4a16_gemm.cu",
  "minimax-m2-229b/nvfp4/moe_w4a16_grouped_gemm.cu",
  "minimax-m2-229b/nvfp4/rms_norm.cu",
  "minimax-m2-229b/nvfp4/w4a16_gemm_v2.cu",
  "minimax-m2-229b/nvfp4/w4a16_gemm_v3.cu",
]

# 2026-09-26: Stems whose .cu entry in this layer (its own file or a `use`d source) wins over a common/
# source of the same stem. Each win needs a reason here, and a key that wins nothing is an error
# (crates/closure/src/layout.rs). kernels/FORKS.md lists the diff distances.
[shadow]
moe_silu_mul = "fork of gb10/common/moe_silu_mul.cu (170 of 169 lines differ); see kernels/FORKS.md"
moe_w4a16_grouped_gemm = "uses gb10/minimax-m2-229b/nvfp4/moe_w4a16_grouped_gemm.cu over gb10/common/moe_w4a16_grouped_gemm.cu (1898 of 1642 lines differ); see kernels/FORKS.md"
rms_norm = "uses gb10/minimax-m2-229b/nvfp4/rms_norm.cu over gb10/common/rms_norm.cu (1620 of 1433 lines differ); see kernels/FORKS.md"
w4a16_gemm = "uses gb10/deepseek-v4-flash/nvfp4/w4a16_gemm.cu over gb10/common/w4a16_gemm.cu (1402 of 1410 lines differ); see kernels/FORKS.md"
