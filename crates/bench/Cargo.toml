# SPDX-License-Identifier: MIT OR Apache-2.0
[package]
name = "metrale-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Metrale Engine: plugin + benchmark abstraction and registry driven by the metrale-server TUI"

# 2026-09-26: No GPU, model or server dependency: this crate drives a served
# endpoint over HTTP and runs provisioned artifacts as child processes, and it
# builds and tests without CUDA (metrale-config has its default `cuda` feature
# off).
[dependencies]
# 2026-09-26: The PR journey ledger, written by the `ledger_append` and
# `ledger_harvest` binaries.
metrale-governance = { path = "../governance" }
metrale-closure = { path = "../closure" }
# 2026-09-26: The METRALE_* lever table: which names are serve levers and which are the box's.
metrale-config = { path = "../config", default-features = false }
# 2026-09-26: Parses BENCH.toml and HARDWARE.toml.
toml = "1.1"
anyhow = { workspace = true }
# 2026-09-26: SHA-256 for dataset digests, provisioning stamps and record
# fingerprints; the workspace pin.
sha2 = { workspace = true }
# 2026-09-26: Ed25519 for gate-record signatures (gate::signing). ring is
# already in Cargo.lock through rustls, which ureq uses, so this adds an edge and
# no new package. Its licence, `Apache-2.0 AND ISC`, is covered by deny.toml's
# allow-list. ring's build script compiles C with `cc`, so building this crate
# needs a C toolchain.
ring = "0.17"

serde = { workspace = true }
serde_json = { workspace = true }
parking_lot = { workspace = true }
tracing = "0.1"
# 2026-09-26: `Stream` for `Benchmark::run`, `BoxFuture` for `DynBenchmark`.
futures = "0.3"
# 2026-09-26: Media fixtures reach the API as base64 `data:` URIs, since the
# server refuses remote image URLs unless started with
# `--vision-allow-remote-images`. The same 0.22 the other crates use.
base64 = "0.22"
# 2026-09-26: TCP to the endpoint, child processes for provisioned artifacts,
# timers. No `rt-multi-thread`: the executor spawns onto a runtime the caller
# owns.
tokio = { version = "1", features = [
    "io-util",
    "macros",
    "net",
    "process",
    "rt",
    "sync",
    "time",
] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[lints]
workspace = true
