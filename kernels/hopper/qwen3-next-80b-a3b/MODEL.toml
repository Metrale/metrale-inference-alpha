# 2026-09-25: Hopper target: kernel set inherited from gb10 (HARDWARE.toml `inherits`).
# Every table below equals kernels/gb10/qwen3-next-80b-a3b/MODEL.toml's, [expected_absent]
# included: that list is gb10's, while `met serve --check-kernels` reports the
# lookups that do not resolve on this hardware.
# This directory holds no quant directory, so the leaf kernels are gb10's
# qwen3-next-80b-a3b/nvfp4 (crates/closure/src/layout.rs `discover`).

[model]
name = "qwen3-next-80b-a3b"
hf_id = "nvidia/Qwen3-Next-80B-A3B-Instruct-NVFP4"
params = "80B"
active_params = "3B"
layers_attention = 12
layers_ssm = 36
moe_experts = 512
moe_topk = 10
hidden_dim = 2048
head_dim = 256
q_heads = 16
kv_heads = 2





[sampling.thinking_text]
temperature = 0.7
top_p = 0.8
top_k = 20
presence_penalty = 0.0
repetition_penalty = 1.0
dry_multiplier = 0.0

[sampling.thinking_coding]
temperature = 0.6
top_p = 0.95
top_k = 20
presence_penalty = 0.0
repetition_penalty = 1.0
dry_multiplier = 0.0

[sampling.non_thinking]
temperature = 0.7
top_p = 0.8
top_k = 20
presence_penalty = 0.0
repetition_penalty = 1.0
dry_multiplier = 0.0

[[model_types]]
model_type = "qwen3_next"





[behavior]



enable_loop_watchdog = true




thinking_in_tools = true



max_thinking_budget = 4096



thinking_default = false


default_num_drafts = 1

[kernel]
moe_gate_shmem_bytes = 4096






[expected_absent.w4a16]
w4a16_gemm_t_p3 = """
3-deep weight-pipeline twin shipped ONLY in qwen3.6-27b's shadow.
layers::tgemm_kernel probes it, falls back to w4a16_gemm_t (resolves
here, via common). UNMEASURED for this target — candidate, not loss."""
w4a16_gemm_t_k64_p3 = "Same family; layers::k64_kernel falls back to the required w4a16_gemm_t_k64 (resolves via common)."
w4a16_gemm_t_k64_n64_p3 = "Narrow-N twin; layers::k64_n64_kernel returns 0-handle, dispatch gates on handle != 0."
w4a16_gemm_t_m128_bf16 = "BF16-projection prefill twin; prefill_weights gates on handle != 0, falls back through the resolved w4a16 path."

[expected_absent.w4a4]
w4a4_gemm_mfast = """
Shipped only in nemotron-labs-3-puzzle-75b-a9b. Dispatch falls back to
w4a4_gemm (resolves from common). UNMEASURED — candidate, not loss."""

[expected_absent.moe_w4a16]
moe_w4a16_grouped_gemm_ptrtable_e8m0 = "Native-MXFP4 E8M0 variant, shipped only in deepseek-v4-flash. This target is NVFP4; the resolved ptrtable grouped GEMM serves it."
moe_w4a16_grouped_gemm_ptrtable_t_e8m0 = "Same E8M0 family — NVFP4 target uses the resolved ptrtable_t variant."
moe_w4a16_grouped_gemm_ptrtable_t_k64_e8m0 = "Same E8M0 family — NVFP4 target uses the resolved ptrtable_t_k64 variant."
moe_w4a16_fused_gate_up_t_e8m0 = "Same E8M0 family — NVFP4 target uses the resolved fused_gate_up variant."
moe_w4a16_fused_gate_up_t_k64_e8m0 = "Same E8M0 family — NVFP4 target uses the resolved fused_gate_up_k64 variant."
moe_w4a16_fused_gate_up_t_k64_fp4 = """
FUSED-FP4 gate_up (METRALE_HOLO_MOE_GATEUP_FP4, Holo-3.1 family). Dispatch
checks handle != 0 before firing; falls back to the resolved w4a16
fused path."""
moe_w4a16_down_t_k64_fp4 = """
FP4 down-projection twin; forward_prefill_routed gates on `down_fp4 &&
handle != 0`; falls back to the resolved w4a16 down path."""
moe_w4a16_fused_gate_up_t_k64_m128 = "M=128 Block-D variant shipped only in minimax-m2-229b; dispatch falls through to M=64."

[expected_absent.gated_delta_rule_wy17]
gated_delta_rule_wy17 = """
wy17 fused decode (K=17) exists only in qwen3.6-35b-a3b's PTX module
set (per the init.rs comment); decode_batched checks non-NULL before
the fused path and keeps the sequential per-token path otherwise."""
[expected_absent.gated_delta_rule_snap]
gated_delta_rule_decode_f32_norm_snap = "Exact-verify snapshot twin (#435/#438), shipped only in qwen3.6-27b/nvfp4; the exact arm probes handle != 0 and falls back to the parent kernel + copy_d2d snapshots (same bits, more launches)."
gated_delta_rule_decode_f32_strided_norm_snap = "Batched exact-verify snapshot twin (#435/#438), shipped only in qwen3.6-27b/nvfp4; the batched exact form declines on handle 0 and the per-sequence exact loop serves (still exact)."

[expected_absent.gdn_verify_fused_conv_kn_f32]
