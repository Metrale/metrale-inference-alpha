id = "gdn_recurrence_strided"
description = "Gated delta rule decode, all sequences in one launch (strided states)"
compute = "cuda_core"
kernels = ["gated_delta_rule::gated_delta_rule_decode_f32_strided"]
rows = [1, 128]
pipeline.gdn_recurrence = { in = ["f32", "f32", "f32"], state = "f32", compute = "f32", out = ["f32"] }
op = [{ op = "gdn_recurrence" }]
[[family.point]]
values = {}
how = "instantiation"
