# 2026-10-02: Load-time derived weight copies: every device allocation the legacy loader makes for
# a weight beyond the checkpoint tensors it stores (the store keeps every tensor resident:
# fast_weights/mod.rs:323 uploads each one as on disk). `met circuit memory` sizes each copy from
# the node's own `out x k` shape and the rule's law (schema: crates/circuit/src/memory/copies.rs).
#
# Owner: metrale-circuit (memory).
# Invariants:
# - A rule matches a node by arch, op (`OpKind::name`), section, the checkpoint's declared weight
#   format (`stored`), the served format (`served`) and serve settings (`when`); an empty list
#   matches any. Every rule cites the loader site that allocates the copy.
# - `law` is a weight format (the whole weight in it), `row_scale_f32` or `block_grid_f32/<r>x<c>`.
#   `nvfp4/g16` is `9/16 x out x k` plus a 4-byte global; the MMQ `block_nvfp4` repack and the
#   transposed twins have the same bytes.
# - `leaked = true` marks an allocation nothing reads and nothing frees (a loader defect): it is
#   resident all the same, and the report totals it apart.
# - Validated against the boot allocation ledgers of the dense 27B (nvfp4 recipe and declared
#   tier), the FP8 35B-A3B recipe and Nemotron-3-Nano (crates/server/src/cli/circuit_memory_ledger_tests.rs).
# - 2026-10-02: The dense 27B's three leaked copies (the attention requant's BF16 intermediates,
#   the replaced GDN out_proj predequant, the first BA interleave) are no longer made (#86).
# - Not modelled (each under 60 MiB on the validated serves, inside the ledger residual): the
#   Nemotron dequant scratch (nemotron.rs:68), F32 widenings of A_log / D / dt_bias
#   (model_a.rs), the 4-byte absmax per quantize (loaders_fp8.rs:171), expert pointer tables.

schema = 1

