# 2026-09-26: Files this directory compiles from elsewhere in kernels/ (paths relative to
# kernels/<hardware>). They are staged with this directory's role, so their quoted
# #includes resolve here. See crates/closure/src/layout.rs.
[sources]
use = [
  "qwen3.6-35b-a3b/nvfp4/gated_delta_rule.cu",
  "qwen3.6-35b-a3b/nvfp4/gated_delta_rule_wy17.cu",
  "qwen3.6-35b-a3b/nvfp4/moe_w4a16_grouped_gemm.cu",
  "qwen3.6-35b-a3b/nvfp4/vision_encoder.cu",
  "qwen3.6-35b-a3b/nvfp4/w4a16_gemm.cu",
]

# 2026-09-25: Entries of this directory that replace a same-stem entry of common/. The
# layout resolver refuses an undeclared replacement, a declaration that replaces nothing,
# and an empty reason (crates/closure/src/layout.rs, layout_manifest.rs).
[shadow]
gated_delta_rule = "uses gb10/qwen3.6-35b-a3b/nvfp4/gated_delta_rule.cu over gb10/common/gated_delta_rule.cu (2368 of 1713 lines differ); see kernels/FORKS.md"
moe_w4a16_grouped_gemm = "uses gb10/qwen3.6-35b-a3b/nvfp4/moe_w4a16_grouped_gemm.cu over gb10/common/moe_w4a16_grouped_gemm.cu (2612 of 2355 lines differ); see kernels/FORKS.md"
w4a16_gemm = "uses gb10/qwen3.6-35b-a3b/nvfp4/w4a16_gemm.cu over gb10/common/w4a16_gemm.cu (1926 of 1937 lines differ); see kernels/FORKS.md"
