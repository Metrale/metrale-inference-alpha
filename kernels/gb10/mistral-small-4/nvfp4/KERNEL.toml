# 2026-09-25: Files this directory compiles from elsewhere in kernels/ (paths relative to kernels/<hardware>). They
# are staged with this directory's role, so their quoted #includes resolve here. See crates/closure/src/layout.rs.
[sources]
use = [
  "deepseek-v4-flash/nvfp4/grouped_gemm_mla.cu",
  "deepseek-v4-flash/nvfp4/w4a16_gemm.cu",
  "gemma-4-26b-a4b/nvfp4/moe_w4a16_grouped_gemm.cu",
  "minimax-m2-229b/nvfp4/rms_norm.cu",
]


# 2026-09-25: Entries of this directory that win over a common/ entry with the same file stem. Each needs a stated
# reason; an undeclared win and a declaration that wins nothing are both layout errors.
[shadow]
moe_w4a16_grouped_gemm = "uses gb10/gemma-4-26b-a4b/nvfp4/moe_w4a16_grouped_gemm.cu over gb10/common/moe_w4a16_grouped_gemm.cu (1625 of 1369 lines differ); see kernels/FORKS.md"
rms_norm = "uses gb10/minimax-m2-229b/nvfp4/rms_norm.cu over gb10/common/rms_norm.cu (1620 of 1433 lines differ); see kernels/FORKS.md"
rope = "fork of gb10/common/rope.cu (428 of 590 lines differ); see kernels/FORKS.md"
w4a16_gemm = "uses gb10/deepseek-v4-flash/nvfp4/w4a16_gemm.cu over gb10/common/w4a16_gemm.cu (1402 of 1410 lines differ); see kernels/FORKS.md"
