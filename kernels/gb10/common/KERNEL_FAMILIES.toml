# 2026-09-29: Causal depthwise conv1d step with SiLU; bias pointer may be null and d_conv is a
# runtime argument (causal_conv1d.cu:48,96). Grid over the batch; the conv state must be
# contiguous across it.
[[family]]
id = "causal_conv1d"
description = "Causal conv1d update + SiLU (Mamba2 xBC, GDN legacy path); writes no per-row window snapshots"
compute = "cuda_core"
kernels = ["causal_conv1d::causal_conv1d_update"]
rows = [1, 4096]
# 2026-10-02: The window is FP32 (causal_conv1d.cu:111-119); the output is rounded to BF16 (:132),
# the Mamba2 `xbc_c` format, not the GatedDeltaNet `conv` (f32).
pipeline.conv1d_update = { in = ["bf16"], state = "f32", compute = "f32", out = ["bf16"] }
op = [{ op = "conv1d_update" }]
[[family.param]]
name = "channels"
kind = "runtime"
from = { conv1d_update = "in_dim" }
[[family.param]]
name = "bias"
kind = "runtime"
from = { conv1d_update = "param:bias" }
# 2026-09-29: The GatedDeltaNet conv has no bias; the Qwen3.5 circuits do not state it.
absent = "false"
[[family.point]]
values = {}
how = "instantiation"
files = ["kernels/gb10/common/causal_conv1d.cu"]

[[family]]
id = "causal_conv1d_l2norm"
description = "Causal conv1d update + SiLU + L2 norm of the q/k heads (GDN)"
compute = "cuda_core"
# 2026-09-30: The strided twin runs every sequence's row in one launch (the batched GDN arm,
# kernels/gb10/common/FUSIONS.toml).
kernels = [
  "causal_conv1d::causal_conv1d_update_l2norm_f32", "causal_conv1d::causal_conv1d_update_l2norm",
  "causal_conv1d::causal_conv1d_update_l2norm_f32_strided",
]
rows = [1, 4096]
# 2026-10-02: The conv output reaches the L2 norm in FP32 registers; the verify kernel
# `causal_conv1d_update_l2norm` writes BF16 q/k/v (causal_conv1d.cu:405), the f32 twins FP32
# (:470, :555). The verify's window snapshots are host copies of the FP32 window.
pipeline.conv1d_update = { in = ["bf16"], state = "f32", compute = "f32", out = ["f32"] }
pipeline.state_snapshot = { in = ["f32"], state = "f32", out = [] }
pipeline.l2_norm = { in = ["f32"], compute = "f32", out = ["f32"] }
kernel_pipeline."causal_conv1d::causal_conv1d_update_l2norm".l2_norm = { in = ["f32"], compute = "f32", out = ["bf16"] }
op = [
  { op = "conv1d_update", feeds = ["l2_norm"] },
  { op = "state_snapshot", after = ["conv1d_update"], beside = ["l2_norm"] },
  { op = "l2_norm" },
]
[[family.point]]
values = {}
how = "instantiation"
files = ["kernels/gb10/common/causal_conv1d.cu"]
[[family.evidence]]
point = {}
rows = [2]
measurement = "qwen3.6-35b-a3b::causal_conv1d_update_l2norm @ decode C=1 (R=2, MTP k=1)"
[[family.evidence]]
point = {}
rows = [4]
measurement = "qwen3.8-27b::causal_conv1d_update_l2norm @ decode C=1 (R=4, MTP k=3)"

[[family]]
id = "gdn_recurrence"
description = "Gated delta rule decode (one row per sequence) and the WY verify kernels (K = 2, 3, 4)"
compute = "cuda_core"
kernels = [
  "gated_delta_rule::gated_delta_rule_decode_f32", "gated_delta_rule::gated_delta_rule_decode_f32_norm",
  "gated_delta_rule_wy::gated_delta_rule_wy2", "gated_delta_rule_wy3::gated_delta_rule_wy3",
  "gated_delta_rule_wy4::gated_delta_rule_wy4",
]
rows = [1, 4]
# 2026-10-02: State and arithmetic FP32 in every kernel; the WY verify kernels read BF16 q/k/v
# and write BF16 `core` (gated_delta_rule_wy.cu:170-171, _wy3.cu:162-164, _wy4.cu:173-176).
pipeline.gdn_recurrence = { in = ["f32", "f32", "f32"], state = "f32", compute = "f32", out = ["f32"] }
pipeline.gated_rms_norm = { in = ["f32", "bf16"], compute = "f32", out = ["bf16"] }
kernel_pipeline."gated_delta_rule_wy::gated_delta_rule_wy2".gdn_recurrence = { in = ["bf16", "f32", "f32"], state = "f32", compute = "f32", out = ["bf16"] }
kernel_pipeline."gated_delta_rule_wy3::gated_delta_rule_wy3".gdn_recurrence = { in = ["bf16", "f32", "f32"], state = "f32", compute = "f32", out = ["bf16"] }
kernel_pipeline."gated_delta_rule_wy4::gated_delta_rule_wy4".gdn_recurrence = { in = ["bf16", "f32", "f32"], state = "f32", compute = "f32", out = ["bf16"] }
op = [{ op = "gdn_recurrence" }, { op = "gated_rms_norm", after = ["gdn_recurrence"] }]
[[family.point]]
values = {}
how = "instantiation"
files = [
  "kernels/gb10/common/gated_delta_rule.cu", "kernels/gb10/common/gated_delta_rule_wy.cu",
  "kernels/gb10/common/gated_delta_rule_wy3.cu", "kernels/gb10/common/gated_delta_rule_wy4.cu",
]
[[family.evidence]]
