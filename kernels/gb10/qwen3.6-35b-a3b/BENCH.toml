2026-08-29 step and dgx1 read 994 / 2140 on 2026-08-28 too, so they are pre-step records, not \
evidence about the current level. \
LEVEL HISTORY, from the records: median 1640 on 2026-08-06; 1583 after the 2026-08-21 re-cut; \
976 on 2026-08-23 (e1fd858f14, spark-256a, the first sub-1000 record); 923 on 2026-08-29 and \
~900 since. The superseded ceilings (1623.59 / 4482.03, cut 2026-08-21 from the dgx1 baseline \
1576.3 x +3% and 4268.6 x +5%) had drifted to 1.8x / 2.2x the measured level, so no cold-TTFT \
regression short of a near-doubling could fail them — the same drift the 2026-08-21 re-cut \
