[book]
title = "The Metrale Engine Book"
authors = ["Metrale Engine contributors"]
description = "A comprehensive guide to Metrale Engine — pure-Rust LLM inference for hyperoptimized (Hardware, Model, Quantization) kernel targets."
language = "en"
multilingual = false
src = "src"

[build]
build-dir = "output"
create-missing = false

[output.html]
default-theme = "navy"
preferred-dark-theme = "navy"
site-url = "/"
git-repository-url = "https://github.com/Metrale/metrale-inference-alpha"
git-repository-icon = "fa-github"
edit-url-template = "https://github.com/Metrale/metrale-inference-alpha/edit/main/book/{path}"
no-section-label = false
# Tokens first, then the skin that consumes them, then the Metrale layer that
# puts the wordmark in the menu bar. metrale-tokens.css is a symlink to
# web-shared/metrale-tokens.css, the palette's one copy in this repository.
# mdBook reads through the link and copies the CONTENT into the output.
additional-css = ["theme/css/metrale-tokens.css", "theme/css/metrale.css", "theme/css/wordmark.css"]
# The menu-bar wordmark, generated by assets/brand/lockup.mjs.
additional-js = ["theme/metrale.js"]
# The brand faces (Urbanist, IBM Plex Mono) come from theme/fonts/fonts.css and
# the font files linked beside it, which mdBook copies to fonts/. mdBook's own
# Open Sans and Source Code Pro would be ~100 KB of unused payload.
copy-fonts = false

[output.html.print]
enable = true

[output.html.fold]
enable = true
level = 1

[output.html.search]
enable = true
limit-results = 30
teaser-word-count = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3

[output.html.redirect]
"/api.html" = "https://docs.dev.metrale.ai/"
"/api/index.html" = "https://docs.dev.metrale.ai/"
