[model]
name = "qwen3.5-27b"
hf_id = "Kbenkhaled/Qwen3.5-27B-NVFP4"
params = "27B"
active_params = "27B"
architecture = "Hybrid Attention + SSM (Dense FFN)"

# 2026-09-25: Needle for crates/kernels/src/resolve.rs. No other gb10 MODEL.toml declares this target's
# (qwen3_5, any hidden_size) wildcard, so build.rs does not require it. A qwen3_5 checkpoint with
# hidden_size 5120 matches the exact (qwen3_5, 5120) tier first, where qwen3.6-27b and qwen3.8-27b
# collide and qwen3.6-27b's needles include "qwen3.5-27b"; the wildcard tier is tried only when no
# exact entry matches.




match_names = ["qwen3.5-27b"]

layers_total = 64
layers_full_attention = 16
layers_linear_attention = 48

hidden_dim = 5120
head_dim = 256
q_heads = 24
kv_heads = 4
intermediate_size = 17408

vocab_size = 248320
max_position_embeddings = 262144
rope_theta = 10000000
attn_output_gate = true
partial_rotary_factor = 0.25

mtp_layers = 0
vision = true

[[model_types]]
model_type = "qwen3_5"

# 2026-09-25: The local Kbenkhaled/Qwen3.5-27B-NVFP4 config.json enables interleaved MRoPE, but
# parse_config (crates/config/src/dispatch.rs) rewrites only qwen3_5_moe and qwen3_vl_moe configs to
# qwen3_6_moe, so this dense checkpoint keeps model_type qwen3_5.





















[sampling.thinking_text]
temperature = 0.6
top_p = 0.95
top_k = 20
presence_penalty = 0.0
repetition_penalty = 1.1
dry_multiplier = 0.5

[sampling.thinking_coding]
temperature = 0.6
top_p = 0.95
top_k = 20
presence_penalty = 0.0
repetition_penalty = 1.1
dry_multiplier = 0.5

[sampling.non_thinking]
temperature = 0.7
top_p = 0.8
top_k = 20
presence_penalty = 0.0
repetition_penalty = 1.1
dry_multiplier = 0.5

[behavior]
# 2026-09-25: Arms the content-loop watchdog (a CLI flag or METRALE_CONTENT_LOOP_WATCHDOG overrides it),
# which detects a repeated token pattern in the content and rolls back or ends the response
# (crates/server/src/scheduler/helpers.rs).


enable_loop_watchdog = true

thinking_default = true
thinking_in_tools = true
# 2026-09-25: Set explicitly: the built-in default is 256.
max_thinking_budget = 2048

# 2026-09-25: Lookups this target's dispatch may issue and fail to resolve without failing the boot
# audit (crates/kernels/build_parse.rs parse_expected_absent); each value is the stated reason.











# 2026-09-25: With --ssm-h-dtype f16 the GDN decode paths launch the FP16 twins (gdn_f16_norm_k,
# gdn_f16_strided_norm_half_k) without a zero-handle check (qwen3_ssm/ssm_forward.rs,
# qwen3_ssm/trait_decode_multi_seq/ssm_batched_recurrent.rs), and this target defines neither.



[expected_absent.gated_delta_rule]
gated_delta_rule_decode_f16_norm = "FP16 h-state twin; see honesty note above. F32 fused-norm arm resolves."
gated_delta_rule_decode_f16_strided_norm_half = "FP16 h-state twin; see honesty note above. F32 strided-norm arm resolves."
gated_delta_rule_decode_f32_strided_norm_half = "Half-register twin; selected only under the resolved half-register gate (METRALE_GDN_HALF_REG presence, off as shipped)."
gated_delta_rule_decode_f32_strided_norm_smem = "SMEM-staged twin; gated behind METRALE_GDN_SMEM_STAGE (off as shipped) AND the half-register gate."

[expected_absent.gated_delta_rule_wy17]
gated_delta_rule_wy17 = """
wy17 fused decode (K=17) exists only in qwen3.6-35b-a3b's PTX module
set (per the init.rs comment); decode_batched checks non-NULL before
the fused path and keeps the sequential per-token path otherwise."""
[expected_absent.gated_delta_rule_snap]
gated_delta_rule_decode_f32_norm_snap = "Exact-verify snapshot twin (#435/#438), shipped only in qwen3.6-27b/nvfp4; the exact arm probes handle != 0 and falls back to the parent kernel + copy_d2d snapshots (same bits, more launches)."
gated_delta_rule_decode_f32_strided_norm_snap = "Batched exact-verify snapshot twin (#435/#438), shipped only in qwen3.6-27b/nvfp4; the batched exact form declines on handle 0 and the per-sequence exact loop serves (still exact)."

[expected_absent.gdn_verify_fused_conv_kn_f32]
gdn_verify_fused_conv_kn_f32 = "FP32 fused verify conv for the exact-verify chain (#435/#438), shipped only in qwen3.6-27b/nvfp4; probed handle != 0, absent keeps the per-token conv launches (same bits, more launches)."

[expected_absent.nvfp4_mmq]
metrale_nvfp4_mmq128_nc = """
