# 2026-09-25: Files this directory compiles from elsewhere in kernels/ (paths relative to kernels/<hardware>).
# They are staged with this directory's role, so their quoted #includes resolve here. See
# crates/closure/src/layout.rs.
[sources]
use = [
  "deepseek-v4-flash/nvfp4/paged_decode_attn_512.cu",
  "deepseek-v4-flash/nvfp4/w4a16_gemm.cu",
  "gemma-4-26b-a4b/nvfp4/gelu.cu",
  "gemma-4-26b-a4b/nvfp4/paged_decode_attn_fp8_512.cu",
]

# 2026-09-25: Entries of this layer (its own files and its `use`d sources) that win over a common/ entry
# with the same stem. Each needs a stated reason; an undeclared win and a declaration that wins nothing
# are both layout errors. kernels/FORKS.md lists the diff distances.
[shadow]
rms_norm = "fork of gb10/common/rms_norm.cu (1102 of 1433 lines differ); see kernels/FORKS.md"
w4a16_gemm = "uses gb10/deepseek-v4-flash/nvfp4/w4a16_gemm.cu over gb10/common/w4a16_gemm.cu (1402 of 1410 lines differ); see kernels/FORKS.md"
