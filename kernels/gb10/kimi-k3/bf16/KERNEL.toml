# 2026-09-25: Kimi K3 BF16 kernel target: kda_decode.cu and mla_decode.cu live here; the E8M0
# grouped GEMM (moe_w4a16_grouped_gemm_ptrtable_e8m0) comes from deepseek-v4-flash/nvfp4.

[build]

[modules]
moe_w4a16_grouped_gemm = "moe_w4a16"

# 2026-09-26: Files this directory compiles from elsewhere in kernels/ (paths relative to
# kernels/<hardware>). They are staged with this directory's role, so their quoted
# #includes resolve here. See crates/closure/src/layout.rs.
[sources]
use = [
  "deepseek-v4-flash/nvfp4/moe_w4a16_grouped_gemm.cu",
]

# 2026-09-25: Entries of this directory that replace a same-stem entry of common/. The
# layout resolver refuses an undeclared replacement, a declaration that replaces nothing,
# and an empty reason (crates/closure/src/layout.rs, layout_manifest.rs).
[shadow]
moe_w4a16_grouped_gemm = "uses gb10/deepseek-v4-flash/nvfp4/moe_w4a16_grouped_gemm.cu over gb10/common/moe_w4a16_grouped_gemm.cu (1954 of 1494 lines differ); see kernels/FORKS.md"
