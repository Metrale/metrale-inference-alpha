# 2026-09-25: Gate benchmarks for Qwen3.6-35B-A3B on GB10, and the bounds their records must meet.
#
# Owner: gb10 kernels.
# Read by gate::bench (crates/bench/src/gate/bench.rs) and scripts/check_bench_threshold_prose.py.
# BENCH.toml is outside every target's closure hash: taxon::configs lists HARDWARE.toml, the
# KERNEL.toml files and MODEL.toml, not this file.
#
# Invariants:
# - A [benchmarks.*] sub-table belongs to the [[benchmarks]] entry above it.
# - gate::bench::load_all refuses a status other than measured or unmeasured, an unmeasured
#   entry with metrics, a measured entry with none, and a `port` serve pin.
# Scoring (gate::scoring): `min` passes when value + noise >= min, `max` when
# value - noise <= max. Every Qwen/Qwen3.6-35B-A3B-FP8 entry pins gpu_memory_utilization
# 0.85, the GB10 setting the owner chose on 2026-09-23.



[[benchmarks]]
quant = "nvfp4"
checkpoint = "Qwen/Qwen3.6-35B-A3B-FP8"
gate = "agentic-webserver"
recipe = "qwen3.6/qwen3.6-35b-a3b-fp8-bf16head"
# 2026-09-25: The name the TUI's variant list shows (gate::bench BenchEntry::label).

label = "Qwen3.6-35B-A3B MoE flagship (FP8)"
default = true
status = "measured"
note = """\
★ HARNESS PORT DONE AND MEASURED; the residual is a THRESHOLD question, not a defect. Four \
real harness defects were found and fixed (2fcea05b): the warm cargo target dir was never \
warmed and pointed at the wrong path, so the agent's first `cargo test` cold-built the dep \
tree and hit the 180 s command timeout; `run_shell` read both pipes to EOF before \
child.wait(), so any `cargo run &` -- which the prompt invites -- burned the full timeout \
and returned nothing; `ping()` used a line reader, scoring a live newline-less `pong` as \
dead; and five followed_directions regexes diverged from followed_directions.py. MEASURED \
before -> after, same box, N=10 tiers: webserver_ok 3/9/6/7 -> 10 and 8; followed_directions \
0/6/4/7 -> 9 and 5; Sigma-wall 394-637 s -> 923 and 734 s, with the agent now taking 10-18 \
turns per run instead of 3-7. One tier reached the full 10/10. REMAINING: 10/10 AND 10/10 is \
not reachable ON DEMAND. temperature is 0.0 (STALE NOTE FIXED 2026-08-09: this said 0.3; \
0.0 landed in c050ced3f and binary 8b7de2638 carries it) -- the value the harness pins and the \
one that scored 10/10 there -- so this gate is stochastic by construction. An exact 10-of-10 \
bar on a stochastic instrument fails a healthy build roughly half the time. OWNER DECISION, \
deliberately not taken here: either state these bounds as a distribution over k tiers (e.g. \
best-of-2, or a mean with a floor), or keep the exact bar and accept re-runs. Lowering the \
counts to today's draw is still the wrong move, which is why they are unchanged. The ENGINE \
is not in question: the shell harness scored webserver_ok 10/10 and cargo_valid 10/10 on \
this same binary. || original: Gate A (benchmark-pr skill): N=10 agentic-webserver on the \
35B MoE flagship — 10/10 webserver_ok, 10/10 followed_directions, Σwall <= 1300 s \
(SUPERSEDED: the ceiling in force is `sum_wall_s` <= 700, lowered 2026-09-21 — read its \
metric comment below, not this paragraph). The two \
10/10 counts are ABSOLUTE correctness bounds and take no noise. ★ Σwall is DELIBERATELY NOT \
RATCHETED to the 978.13 s best (PR #388, dgx3): unlike the BFCL scores, tier Σwall carries \
+/-200-300 s of run-to-run noise from single 230-320 s outlier iterations, so a ~978 s \
ceiling would fail constantly on healthy builds. 1300 s was a BLOWUP DETECTOR, not a perf \
gate — it cannot see a 5-10% TTFT regression, which is what the two TTFT gates are for. \
Historical band Σwall 950-1287 s; high-water (fastest) 978.13 s recorded here for reference \
only. Walls are box-specific: compare like-for-like or not at all. || ★ `iterations` is \
PINNED at exactly 10, the N the two 10/10 bounds are written for. A count bound alone does \
not describe the run that produced it: `webserver_ok >= 10` is satisfied by 12 successes out \
of 20, and `sum_wall_s` <= 700 is satisfied by 5 iterations. Neither is the gate. This adds a \
threshold, it does not relax one -- the recorded runs all carry iterations 10."""

[benchmarks.serve_overrides]

gpu_memory_utilization = "0.85"

[benchmarks.metrics.followed_directions]
min = 10.0

[benchmarks.metrics.iterations]
min = 10.0
max = 10.0

[benchmarks.metrics.sum_wall_s]
# 2026-09-25: A blowup detector: speed is bounded by s_per_turn and correctness by the two counts
# of 10. Under --pull-request-gate this max is passed to the driver as wall_budget_s
# (threshold_params in benchmarks/agentic/descriptors.rs). The committed records of
# 2026-09-24 read 576.9, 589.2 and 593.8 s.

































max = 700.0

[benchmarks.metrics.sum_turns]
# 2026-09-25: Degeneracy: an agent that finishes every task in far more turns than the work needs
# is a regression even when each turn is fast. The committed records of 2026-09-24 read
# 125, 127 and 127 turns; the hard cap is max_turns 40 x 10 iterations, 400.

max = 250.0

[benchmarks.metrics.s_per_turn]
# 2026-09-25: Speed: the agent's seconds per turn. Under --pull-request-gate this max is passed to
# the driver as s_per_turn_budget (descriptors.rs). The committed records of 2026-09-24
# read 4.42, 4.52 and 4.67.
















max = 8.5

[benchmarks.metrics.webserver_ok]
min = 10.0

