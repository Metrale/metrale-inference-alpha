name: Docs

on:
  # Manually runnable. During the 2026-08-06 Actions incident, webhook triggers
  # were throttled to aid recovery, so pushes stopped creating runs at all --
  # and with no dispatch trigger there was no way to ask for one. A check that
  # can only be started by an event you do not control is a check you cannot
  # get a verdict from when you most need it.
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'book/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/docs.yml'
  # No path filter on pull_request: this check is in the required set, and a
  # path-filtered required check never reports on PRs outside its paths
  # (kernel-only diffs), leaving them permanently "expected" and unmergeable.
  pull_request:
    branches: [main, master]
  # Merge queue: same reasoning — this job is required, queue commits fire
  # none of the events above, so report on every entry unfiltered. The deploy
  # job stays push-only by its own `if`.
  merge_group:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

env:
  # Skip CUDA/nvcc in build.rs so rustdoc can run on hosts without a GPU.
  # - METRALE_SKIP_BUILD=1: metrale-kernels emits a stub target_ptx.rs
  # - CUDARC_CUDA_VERSION=13000: short-circuits cudarc's `nvcc --version`
  #   probe. Format is {major}0{minor}0 — 13000 == CUDA 13.0, Metrale Engine's minimum.
  METRALE_SKIP_BUILD: "1"
  CUDARC_CUDA_VERSION: "13000"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  # Which trees does this change touch? A PR that only edits the web
  # properties does not need the Rust and CUDA work, but the SKIP has to happen
  # at JOB level: a `paths:` filter on the trigger would stop the workflow
  # running at all, the required check would never be created, and the PR would
  # wait on it forever. Five workflows here carry that lesson in their
  # comments; this is the safe half of it.
  changes:
    name: classify diff (web-only?)
    runs-on: >-
      ${{ vars.USE_METRALE_UBUNTU_RUNNERS == '1'
          && (github.event_name != 'pull_request'
           || github.event.pull_request.head.repo.full_name == github.repository)
          && (vars.PR_CHEAP_RUNNER || 'ubuntu-latest')
          || 'ubuntu-latest' }}
    permissions:
      contents: read
      # The classifier reads the changed-file list from the API now, not from a
      # clone, so it needs to see the pull request. `contents: read` alone was
      # enough when the answer came from git.
      pull-requests: read
    outputs:
      web_only: ${{ steps.classify.outputs.web_only }}
      web_touched: ${{ steps.classify.outputs.web_touched }}
      blog_touched: ${{ steps.classify.outputs.blog_touched }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Depth 1: the classifier asks the API for the file list, so no
          # commit graph is needed here — only the script itself. This job used
          # to fetch the WHOLE history, six times per push, to compute three
          # booleans.
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: .github/scripts
      - id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUM: ${{ github.event.pull_request.number }}
          MG_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MG_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: bash .github/scripts/classify-diff.sh

  build:
    name: Build mdBook + rustdoc
    needs: [changes]
    # This job must RUN on a web-only diff: its mdBook half IS the gate for
    # `book/`, and it is a required context. Only the rustdoc half is skipped,
    # at STEP level — see the steps below.
    #
    # ★ `!cancelled()` is what makes that true even when `changes` FAILS.
    # Default `needs:` semantics carry an implicit `success()`, so a broken
    # classify-diff.sh SKIPPED this job — and a skipped required context is
    # counted as satisfied by branch protection and the merge queue. The docs
    # gate would then have waved a PR through while reporting nothing, which is
    # the same defect class as a check that tests a stub. Naming a status
    # function suppresses the implicit success(); `web_only` then resolves to
    # the empty string, the step-level `!= 'true'` guards are true, and the
    # rustdoc half runs. Fails OPEN, exactly as ci.yml's clippy/test and
    # coverage.yml already do — this job was the one that did not.
    # Pinned by .github/scripts/assert-gates-are-wired.py.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install mdBook
        uses: peaceiris/actions-mdbook@ee69d230fe19748b7abf22df32acaa93833fad08 # v2
        with:
          mdbook-version: '0.4.40'

      - name: Install Rust toolchain
        if: needs.changes.outputs.web_only != 'true'
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache Cargo build
        if: needs.changes.outputs.web_only != 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # llms.txt (https://llmstxt.org) is generated from SUMMARY.md, which is
      # already the book's table of contents. A second index maintained by hand
      # goes stale the first time a chapter is added, and a stale index is worse
      # than none for the agents that read it — they cannot tell.
      - name: llms.txt is current with SUMMARY.md
        run: node book/scripts-gen-llms.mjs --check

      - name: Build mdBook
        run: mdbook build book

      # mdBook copies non-markdown files from src/ into the build output, which
      # is how src/llms.txt reaches the site root. That is documented behaviour
      # rather than something this repo controls, so it is asserted rather than
      # assumed: if a future mdBook stops doing it, the file disappears from the
      # deployed site silently, and only a request would ever show it.
      - name: mdBook copied llms.txt into the output
        run: |
          test -s book/output/llms.txt || {
            echo "::error::book/output/llms.txt is missing or empty after mdbook build."
            echo "mdBook is expected to copy non-markdown files from book/src/ to the output."
            exit 1
          }
          head -3 book/output/llms.txt

      # The brand assets come from site/static rather than a third committed
      # copy: the favicons and the social card are byte-identical across the
      # three properties today, and a copy is how they stop being.
      - name: Brand assets from site/static
        run: |
          cp site/static/favicon.svg site/static/favicon.ico \
             site/static/favicon-16.png site/static/favicon-32.png site/static/favicon-48.png \
             site/static/apple-touch-icon.png \
             site/static/og-image.png book/output/
          cmp site/static/og-image.png book/output/og-image.png

      # theme/head.hbs emits everything handlebars can. This adds what it
      # cannot: a canonical URL derived from the file path, and a description
      # taken from each chapter's own first paragraph. The script is its own
      # assertion and exits non-zero if any page ends up without a full card.
      # The Pages control file. It is not part of the mdBook output, so it is
      # copied in here the same way the brand assets above are. Read the note at
      # the top of it before editing: Pages concatenates a re-declared header
      # rather than replacing it, so every rule in there is scoped not to
      # overlap another.
      - name: Cloudflare Pages headers
        run: cp book/deploy/cloudflare/_headers book/output/_headers

      - name: Inject per-page social meta
        run: node book/scripts-inject-meta.mjs book/output

      # The docs served no OpenGraph tags at all and 404'd on /og-image.png
      # until 2026-08-30, so sharing a docs link produced no card. These greps
      # are what stop that returning quietly.
      - name: Every page carries a card, and the tokens are the shared file
        run: |
          test -L book/theme/css/metrale-tokens.css
          cmp web-shared/metrale-tokens.css book/output/theme/css/metrale-tokens.css
          grep -q 'content="#0E1318"' book/theme/head.hbs
          grep -q -- '--bg: #0E1318' book/output/theme/css/metrale-tokens.css
          grep -q 'property="og:image" content="https://book.dev.metrale.ai/og-image.png"' \
            book/output/index.html
          grep -q 'rel="canonical"' book/output/getting-started/quickstart.html
          test -s book/output/og-image.png
          # The retired orange skin must not come back with a theme bump.
          ! grep -rq 'ff6600' book/output/

      - name: Build rustdoc
        if: needs.changes.outputs.web_only != 'true'
        run: cargo doc --workspace --no-deps

      # rustdoc is its own site (docs.dev.metrale.ai), not a subtree of the
      # book. Skipped with the rustdoc build above; `deploy` is push-only and a
      # push never classifies as web-only, so production always receives it.
      - name: Assemble rustdoc site
        if: needs.changes.outputs.web_only != 'true'
        run: |
          mkdir -p rustdoc-site
          cp -a target/doc/. rustdoc-site/
          cp book/deploy/cloudflare/rustdoc/_headers rustdoc-site/_headers
          # Friendly index pointing at metrale_core
          cat > rustdoc-site/index.html <<'EOF'
          <!DOCTYPE html>
          <html><head><meta charset="utf-8">
          <title>Metrale Engine API Reference</title>
          <meta http-equiv="refresh" content="0; url=metrale_core/index.html">
          </head><body>
          <p>Redirecting to <a href="metrale_core/index.html">metrale_core</a>…</p>
          </body></html>
          EOF

      - name: Upload rustdoc artifact
        if: needs.changes.outputs.web_only != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rustdoc-site
          path: rustdoc-site
          retention-days: 7
          if-no-files-found: error

      - name: Upload site artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: docs-site
          path: book/output
          retention-days: 7
          if-no-files-found: error

  # Cloudflare Pages is what book.dev.metrale.ai and docs.dev.metrale.ai
  # resolve to, so this is the job that publishes both.
  #
  # Direct Upload rather than Pages' git integration — the build above needs a
  # Rust toolchain, mdBook and a full `cargo doc --workspace`, and it carries
  # checks (llms.txt currency, the social-card assertion) that a Pages-native
  # build would bypass.
  deploy:
    name: Deploy the book and rustdoc to Cloudflare Pages
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    environment:
      name: production-docs
      url: https://book.dev.metrale.ai/
    steps:
      - name: Check deploy secret presence
        id: cf_check
        env:
          CF_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ACCOUNT_ID" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set — skipping the Pages deploy."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download site artifact
        if: steps.cf_check.outputs.configured == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: docs-site
          path: docs-site

      - name: Download rustdoc artifact
        if: steps.cf_check.outputs.configured == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: rustdoc-site
          path: rustdoc-site

      # Explicit, because nothing else in this workflow needs Node, so the job
      # would otherwise inherit whatever the runner image ships. wrangler v4
      # refuses to start below Node 22.
      - name: Install Node
        if: steps.cf_check.outputs.configured == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      # `--branch=main` is load-bearing: a deployment on any other branch gets a
      # preview URL and does NOT move the custom domain, which fails silently as
      # "the deploy went green and the docs are stale".
      - name: Publish book.dev.metrale.ai
        if: steps.cf_check.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages deploy docs-site \
            --project-name=metrale-engine-book \
            --branch=main \
            --commit-dirty=true

      - name: Publish docs.dev.metrale.ai
        if: steps.cf_check.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages deploy rustdoc-site \
            --project-name=metrale-engine-docs \
            --branch=main \
            --commit-dirty=true
